<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChatGPT Work Guide</title>
  <meta name="description" content="คู่มือ ChatGPT, ChatGPT Work, Codex และ AI Agent สำหรับการทำงาน — เว็บแอปเรียนรู้แบบ Interactive ใช้งานออฟไลน์ได้">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GPT Guide">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="read-progress" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก">
      <div class="sb-head">
        <button class="icon-btn" id="sb-toggle" aria-label="ย่อ/ขยายเมนู" title="ย่อ/ขยายเมนู">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <a class="brand" href="#/home">
          <span class="logo-mark"><img src="icons/logo.svg" alt="" class="logo-img"></span>
          <span class="brand-text">Work Guide</span>
        </a>
      </div>
      <a class="new-chat" href="#/chat" data-new-chat>
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>ถามคู่มือใหม่</span>
      </a>
      <nav class="sb-nav" id="sb-nav"></nav>
      <div class="sb-foot">
        <button class="sb-item" id="install-btn" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span>ติดตั้งแอป</span>
        </button>
        <button class="sb-item" id="theme-btn">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>สลับธีม</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-btn" aria-label="เปิดเมนู">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <div class="model-pill" id="crumb">ChatGPT Work Guide <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="top-actions">
          <span class="offline-badge" id="offline-badge" hidden>ออฟไลน์</span>
          <div class="progress-chip" title="ความคืบหน้าการเรียน"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="pc-bg"/><circle cx="18" cy="18" r="15" class="pc-fg" id="pc-fg"/></svg><span id="pc-text">0%</span></div>
        </div>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-inner">
          <button type="button" class="icon-btn" id="composer-plus" aria-label="เครื่องมือ" title="เครื่องมือ">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <textarea id="q" rows="1" placeholder="ถามอะไรก็ได้เกี่ยวกับ ChatGPT, Work, Codex, Agent..." aria-label="คำถาม"></textarea>
          <button type="submit" class="send-btn" aria-label="ส่ง">
            <svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
          </button>
        </div>
        <p class="composer-note">ผู้ช่วยค้นคำตอบจากคู่มือในเครื่อง (ออฟไลน์) — ตรวจชื่อโมเดล ราคา และสิทธิ์ใช้งานกับเอกสาร OpenAI ทางการก่อนสอนเสมอ</p>
      </form>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
