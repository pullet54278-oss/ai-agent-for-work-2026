<!doctype html><html lang="th" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm Performance Dashboard (Prototype)</title>
<style>/* Copilot AI Agents for Work 2026 — Fluent 2 inspired UI on the course design tokens (Part 1) */
:root{
  --bg:#F2F4FA;--surface:#FFFFFF;--surface-2:#F4F6FD;--ink:#141A2F;--ink-2:#4E5672;--line:#DADFEE;
  --accent:#2557E0;--accent-ink:#FFFFFF;--accent-soft:#E2E9FD;--accent-hover:#1C47BE;
  --amber:#A3650A;--amber-soft:#FBEBCB;--red:#C23B5A;--green:#178F6B;--green-soft:#DDF3EA;--amber-t:#7A4B05;--green-t:#0D6B50;
  --brand:linear-gradient(115deg,#1F5BE3 0%,#1FA3E6 24%,#22BE97 44%,#F2B225 62%,#EE5A7C 80%,#8A55EA 100%);
  --acrylic:rgba(255,255,255,.78);
  --shadow2:0 1px 2px rgba(20,26,47,.08),0 0 2px rgba(20,26,47,.06);
  --shadow4:0 2px 4px rgba(20,26,47,.10),0 0 2px rgba(20,26,47,.08);
  --shadow8:0 4px 8px rgba(20,26,47,.10),0 0 2px rgba(20,26,47,.08);
  --shadow16:0 8px 16px rgba(20,26,47,.12),0 0 2px rgba(20,26,47,.08);
  --shadow28:0 14px 28px rgba(20,26,47,.18),0 0 8px rgba(20,26,47,.10);
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;
  --ease:cubic-bezier(.33,0,.67,1);--ease-out:cubic-bezier(.1,.9,.2,1);--dur:200ms;
  --font:'IBM Plex Sans Thai','Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-h:'Bai Jamjuree','IBM Plex Sans Thai','Segoe UI Variable Display','Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --tb:60px;--sb:300px;--dc:#5D6684;
  --g-gen:#5D6684;--g-data:#2557E0;--g-farm:#178F6B;--g-inv:#A96F05;--g-fin:#0A86B8;--g-sales:#CF3D69;--g-eng:#7A4FDB;--g-ci:#CF5A22;--g-rep:#4A58B0;
  --g-pb:#B4532A;--g-hat:#B07A12;--g-brl:#2E8B57;--g-lp:#2F6FB5;--g-erp:#6B5BB8;--g-feed:#87661A;--g-lab:#0E8686;--g-qms:#A83A6B;--g-cis:#3E7D3A;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0F1E;--surface:#121931;--surface-2:#18213C;--ink:#E6EAF8;--ink-2:#A1AAC8;--line:#28324F;
  --accent:#7EA2FF;--accent-ink:#0A1230;--accent-soft:#1D2B57;--accent-hover:#A3BCFF;
  --amber:#F0B44A;--amber-soft:#3A2D12;--red:#F27C98;--green:#4FD1A8;--green-soft:#123528;--amber-t:#F0B44A;--green-t:#4FD1A8;
  --acrylic:rgba(18,25,49,.80);
  --shadow2:0 1px 2px rgba(0,0,0,.4);--shadow4:0 2px 4px rgba(0,0,0,.45);--shadow8:0 4px 8px rgba(0,0,0,.5);--shadow16:0 8px 16px rgba(0,0,0,.55);--shadow28:0 14px 28px rgba(0,0,0,.6);
  --g-gen:#9AA3C2;--g-data:#7EA2FF;--g-farm:#4FD1A8;--g-inv:#F0B44A;--g-fin:#4CC3EE;--g-sales:#F57FA2;--g-eng:#B395FF;--g-ci:#F59468;--g-rep:#98A3F0;
  --g-pb:#F0936A;--g-hat:#F2BE5C;--g-brl:#6FD39A;--g-lp:#7FB2F2;--g-erp:#B3A6F2;--g-feed:#D9B865;--g-lab:#5ED1D1;--g-qms:#F08DB8;--g-cis:#8FD48A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--tb) + 16px)}
body{margin:0;background:radial-gradient(900px 520px at 100% -8%,color-mix(in srgb,#8A55EA 9%,transparent),transparent 70%),radial-gradient(900px 520px at 0% 0%,color-mix(in srgb,#1FA3E6 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:400 16px/1.7 var(--font);min-height:100vh;overflow-x:hidden}
img{max-width:100%}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-hover)}
h1,h2,h3,h4{font-family:var(--font-h);line-height:1.3;margin:0}
p{margin:0 0 .75em}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r4);padding:3px 5px;background:var(--surface-2);color:var(--ink-2)}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r4);padding:0 4px;word-break:break-all}
.ic{width:20px;height:20px;flex:none;fill:currentColor;vertical-align:-4px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:8px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:var(--r8)}
.skip:focus{top:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r4)}
::selection{background:var(--accent-soft)}

/* group colour used as TEXT: mix with ink so small text meets WCAG AA in both themes */
.eyebrow,.ccard .cn,.pchap .n,.kv b,.chain-a,.roadstep b,.storyline b,.acard .gid,.ch-n,.module-num,.pill.g,.toc-card:hover .tc-ic,.tc-ic,.olist li::marker{color:color-mix(in srgb,var(--dc) 74%,var(--ink))}

/* ---------- buttons (Fluent) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:var(--r4);border:1px solid transparent;font:600 14px/1.3 var(--font);color:var(--ink);background:transparent;cursor:pointer;text-decoration:none;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform 80ms var(--ease);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow2)}
.btn-primary:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn-outline{border-color:var(--line);background:var(--surface)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-subtle:hover{background:var(--surface-2)}
.btn-icon{width:40px;padding:0}
.btn-icon:hover{background:var(--surface-2)}
.btn-lg{min-height:44px;padding:10px 20px;font-size:16px;border-radius:var(--r8)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-copy.ok{color:var(--green-t)}

/* ---------- top bar (acrylic) ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--tb);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--acrylic);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.tb-menu{display:none}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
.logo-chip{display:inline-flex;border-radius:var(--r8);line-height:0}
.logo-chip img{height:32px;width:auto}
:root[data-theme="dark"] .logo-chip{background:#F4F6FD;padding:4px 8px}
.brand-t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-t b{font:700 22px/1 var(--font-h);letter-spacing:-.01em}
.brand-t small{font-size:12px;color:var(--ink-2);white-space:nowrap}
.copilot-mark{height:24px;width:auto}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.btn-search{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);min-width:200px;justify-content:flex-start;font-weight:500}
.btn-search kbd{margin-left:auto}
.btn-search:hover{border-color:var(--accent)}
.tb-prog{font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:var(--r4);white-space:nowrap}
.tb-prog:hover{background:var(--surface-2);color:var(--ink)}
.tb-line{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--line);overflow:hidden}
.tb-line i{display:block;height:100%;width:0;background:var(--brand);transition:width .5s var(--ease-out)}
:root[data-theme="light"] .ic-moon,:root[data-theme="dark"] .ic-sun{display:none}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);box-shadow:var(--shadow16);padding:4px;z-index:50;animation:pop .16s var(--ease-out)}
.menu a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r4);color:var(--ink);text-decoration:none;font-size:14px}
.menu a:hover,.menu a:focus-visible{background:var(--surface-2)}
.menu a small{display:block;color:var(--ink-2);font-size:12px;line-height:1.3}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start}
.sidebar{position:sticky;top:var(--tb);width:var(--sb);flex:none;height:calc(100vh - var(--tb));display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
.sb-top{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.input-ic{position:relative}
.input-ic .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.input-ic input{padding-left:36px}
input,select,textarea{width:100%;font:400 15px/1.5 var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-bottom-color:var(--ink-2);border-radius:var(--r4);padding:8px 10px;transition:border-color var(--dur) var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-bottom:2px solid var(--accent);padding-bottom:7px}
textarea{resize:vertical;min-height:84px}
.sb-list{flex:1;overflow:auto;padding:8px 8px 16px;overscroll-behavior:contain}
.sb-foot{font-size:11px;color:var(--ink-2);padding:8px 14px;margin:0;border-top:1px solid var(--line)}
.ch{margin-bottom:2px}
.ch-h{display:flex;align-items:center;gap:8px;width:100%;padding:8px 8px 8px 12px;border:0;background:none;color:var(--ink);font:600 14px/1.35 var(--font);text-align:left;border-radius:var(--r4);cursor:pointer;position:relative}
.ch-h::before{content:"";position:absolute;left:2px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--dc)}
.ch-h:hover{background:var(--surface-2)}
.ch-h .chev{transition:transform var(--dur) var(--ease);color:var(--ink-2);width:16px;height:16px}
.ch-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ch-n{font:700 11px/1 var(--font-h);min-width:22px}
.ch-t{flex:1;min-width:0}
.ring{width:22px;height:22px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--dc);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s var(--ease-out)}
.pl{list-style:none;margin:0 0 6px;padding:0 0 0 18px}
.pl[hidden]{display:none}
.pl a{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:var(--r4);color:var(--ink-2);text-decoration:none;font-size:13.5px;line-height:1.4}
.pl a:hover{background:var(--surface-2);color:var(--ink)}
.pl a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.pl .pn{font:500 11px/1.9 var(--mono);color:var(--ink-2);min-width:24px}
.pl .pt{flex:1}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:5px}
.dot.v{border-color:var(--dc)}
.dot.d{background:var(--dc);border-color:var(--dc)}
.scrim{position:fixed;inset:var(--tb) 0 0;background:rgba(5,8,20,.45);z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.main{flex:1;min-width:0;padding:28px 32px 120px;outline:none}
.wrap{max-width:1320px;margin:0 auto}
.page-enter{animation:enter .32s var(--ease-out)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- page header ---------- */
.ph{position:relative;margin-bottom:24px;padding:24px 28px;border-radius:var(--r12);background:var(--surface);box-shadow:var(--shadow4);overflow:hidden;border:1px solid var(--line)}
.ph::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dc)}
.ph-art{position:absolute;right:-20px;top:-30px;width:220px;height:220px;opacity:.9;pointer-events:none}
.crumb{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:10px;position:relative}
.crumb a{color:var(--ink-2);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill .ic{width:16px;height:16px}
.pill.g{border-color:color-mix(in srgb,var(--dc) 35%,transparent);background:color-mix(in srgb,var(--dc) 10%,var(--surface))}
.ph h1{font-size:clamp(27px,3.2vw,40px);font-weight:700;letter-spacing:-.01em;position:relative;max-width:calc(100% - 140px)}
.ph .short{font-size:18px;color:var(--ink-2);margin:10px 0 0;max-width:820px;position:relative}
.ph-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative}
.ready{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.ready .ic{width:15px;height:15px}
.ready-assist{background:var(--accent-soft);color:var(--accent)}
.ready-connected{background:var(--amber-soft);color:var(--amber-t)}
.ready-concept{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* ---------- content blocks ---------- */
.content{font-size:16px}
.content>*+*{margin-top:16px}
.lede{font-size:18px;color:var(--ink);max-width:880px}
.hint{color:var(--ink-2);font-size:14px}
h2.sec{display:flex;gap:10px;align-items:center;font-size:21px;margin:28px 0 12px}
h2.sec .ic{color:var(--dc);width:22px;height:22px}
h3.sub{display:flex;gap:8px;align-items:center;font-size:18px;margin:22px 0 10px}
.cards{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);padding:18px;box-shadow:var(--shadow2);transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease);min-width:0}
.card:hover{box-shadow:var(--shadow8)}
.card h3{font-size:18px;margin-bottom:8px}
.card>p:last-child,.card>ul:last-child{margin-bottom:0}
.eyebrow{display:flex;gap:6px;align-items:center;font:700 12px/1.3 var(--font-h);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.eyebrow .ic{width:16px;height:16px}
.card.stat{text-align:left}
.stat-n{font:700 44px/1 var(--font-h);background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.ulist,.olist{padding-left:22px;margin:0 0 .5em}
.ulist li,.olist li{margin:4px 0}
.ulist li::marker{color:var(--dc)}
.olist li::marker{font-weight:700}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.checks .ic{margin-top:3px}
.checks .ok .ic{color:var(--green)}
.checks .no .ic{color:var(--red)}
.kv{display:flex;flex-wrap:wrap;gap:4px 10px;padding:10px 14px;border-radius:var(--r8);background:var(--surface-2);border:1px solid var(--line)}
.kv b{font-family:var(--font-h)}
.kv-caps b{font-size:12px;letter-spacing:.06em}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface)}
.callout>.ic{color:var(--accent);margin-top:2px;width:22px;height:22px}
.callout p{margin:2px 0 0}
.callout.tip{background:var(--accent-soft);border-color:transparent}
.callout.cta{align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-color:transparent}
.callout.cta>div{flex:1;min-width:200px}
.callout.warn{background:var(--amber-soft);border-color:transparent}
.callout.warn>.ic{color:var(--amber)}
a.callout{text-decoration:none;color:var(--ink);align-items:center}
a.callout:hover{border-color:var(--accent);box-shadow:var(--shadow4)}
a.callout>div{flex:1}
.badge-verify{display:inline-flex;gap:8px;align-items:flex-start;padding:6px 12px;border-radius:var(--r8);background:var(--amber-soft);color:var(--amber-t);font-size:13.5px;font-weight:600;margin:0}
.badge-verify .ic{width:18px;height:18px;margin-top:1px}
.src-note{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.src-note .ic{width:16px;height:16px;margin-top:3px}
.roadstep{display:inline-flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface);margin:0 8px 8px 0;min-width:180px;position:relative}
.roadstep b{font:700 12px/1.2 var(--font-h);letter-spacing:.04em}
.chips{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-size:13.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.chain{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.chain li{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:var(--r8);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2);min-width:120px;flex:1 1 140px;max-width:260px}
.chain li:not(:last-child)::after{content:"";position:absolute;right:-8px;top:50%;width:8px;height:2px;background:var(--dc)}
.chain-t{font-weight:600}
.chain small{color:var(--ink-2);font-style:italic}
.chain li.has-agent{border-color:color-mix(in srgb,var(--dc) 45%,var(--line))}
.chain-a{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;text-decoration:none}
.chain-a .ic{width:16px;height:16px}
.chain-a:hover{text-decoration:underline}

/* ---------- prompt blocks ---------- */
.prompt{border:1px solid var(--line);border-radius:var(--r8);background:var(--surface-2);overflow:hidden;min-width:0}
.prompt-head{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);font:600 12.5px/1.3 var(--font);color:var(--ink-2);background:color-mix(in srgb,var(--surface) 60%,var(--surface-2))}
.prompt-head .ic{width:16px;height:16px;color:var(--accent)}
.prompt-head>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prompt-head .btn{min-height:30px;padding:4px 10px;font-size:13px}
.prompt pre{margin:0;padding:12px 14px;font:400 13.5px/1.65 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;color:var(--ink)}
.prompt pre:focus-visible{outline-offset:-2px}
.prompt code{background:none;border:0;padding:0;font-size:inherit;word-break:inherit}
.card>.prompt{margin:-4px}
.prompt-head .cnt{font:500 12px/1 var(--mono);padding:3px 6px;border-radius:var(--r4);background:var(--surface);border:1px solid var(--line);flex:none}
.cnt.over{color:#fff;background:var(--red);border-color:var(--red)}

/* ---------- steps ---------- */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.step{display:flex;gap:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);box-shadow:var(--shadow2)}
.step-n{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font:700 17px/1 var(--font-h);box-shadow:var(--shadow4)}
.step-b{flex:1;min-width:0}
.step-b h3{font-size:18px;margin:6px 0 6px}
.step-b>*+*{margin-top:10px}
.storyline{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.storyline li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r8);background:var(--surface-2);border:1px solid var(--line)}
.storyline b{font:700 13px/1 var(--font-h)}

/* ---------- tables ---------- */
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r8);background:var(--surface);box-shadow:var(--shadow2);-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px;min-width:640px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl thead th{font:700 13px/1.4 var(--font-h);background:var(--surface-2);color:var(--ink-2);position:sticky;top:0}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.tbl tbody th{font-weight:600}
.tbl tr:last-child>*{border-bottom:0}
.mx td{text-align:center;font-size:18px}
.mx tbody th{white-space:nowrap;font-size:13.5px}
.mx-req{color:var(--accent)}
.mx-opt{color:var(--ink-2)}
.agent-link{display:inline-flex;gap:6px;align-items:center;font-weight:600;text-decoration:none}
.agent-link .ic{width:16px;height:16px}

/* ---------- source "อธิบายเพิ่มเติม" ---------- */
.src-extra{border:1px solid var(--line);border-radius:var(--r12);background:var(--surface);margin-top:28px}
.src-extra>summary{display:flex;gap:10px;align-items:center;padding:14px 18px;cursor:pointer;font:700 17px/1.3 var(--font-h);list-style:none}
.src-extra>summary::-webkit-details-marker{display:none}
.src-extra>summary small{margin-left:auto;font:500 12px var(--font);color:var(--ink-2)}
.src-extra>summary .ic{color:var(--accent)}
.src-extra-body{padding:0 18px 18px}
.src-extra-body>h2.sec:first-child{margin-top:4px}

/* ---------- supplement (added learning layer) ---------- */
.supp{margin-top:32px;border-radius:var(--r12);padding:2px;background:var(--brand);box-shadow:var(--shadow8)}
.supp-in{background:var(--surface);border-radius:calc(var(--r12) - 2px);padding:18px 20px 20px}
.supp-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.supp-head h2{font-size:20px;display:flex;gap:8px;align-items:center}
.supp-head .ic{color:var(--accent)}
.supp-tag{font-size:12px;font-weight:600;color:var(--ink-2);padding:2px 10px;border-radius:999px;border:1px dashed var(--ink-2)}
.tablist{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:thin}
.tablist [role="tab"]{position:relative;border:0;background:none;padding:10px 14px;font:600 14px/1.2 var(--font);color:var(--ink-2);cursor:pointer;white-space:nowrap;border-radius:var(--r4) var(--r4) 0 0}
.tablist [role="tab"]:hover{color:var(--ink);background:var(--surface-2)}
.tablist [role="tab"][aria-selected="true"]{color:var(--ink)}
.tablist [role="tab"][aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
[role="tabpanel"]>*+*{margin-top:12px}
.supp ol.ws{counter-reset:ws;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.supp ol.ws li{counter-increment:ws;display:flex;gap:12px;padding:10px 12px;border-radius:var(--r8);background:var(--surface-2)}
.supp ol.ws li::before{content:counter(ws);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px/1 var(--font-h)}
.vlist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.vlist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r8);cursor:pointer}
.vlist label:hover{background:var(--surface-2)}
.vlist input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent);flex:none}
.vlist input:checked+span{text-decoration:line-through;color:var(--ink-2)}

/* ---------- page footer ---------- */
.done-bar{margin-top:32px;display:flex;justify-content:center}
.btn-done{min-height:48px;padding:10px 22px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);font-size:15px}
.btn-done:hover{background:var(--accent-soft)}
.btn-done[aria-pressed="true"]{background:var(--green-t);border-color:var(--green-t);color:var(--surface)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);box-shadow:var(--shadow2);transition:box-shadow var(--dur),border-color var(--dur)}
.pager a:hover{border-color:var(--accent);box-shadow:var(--shadow8)}
.pager small{color:var(--ink-2);font-size:13px}
.pager b{font-weight:600}
.pager .nx{text-align:right;grid-column:2}
.copy-line{text-align:center;color:var(--ink-2);font-size:13px;margin:36px 0 0}

/* ---------- agent page ---------- */
.agent-layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:24px;align-items:start}
.agent-main{min-width:0}
.sec-nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:thin}
.sec-nav a{flex:none;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);text-decoration:none;background:var(--surface)}
.sec-nav a:hover{color:var(--accent);border-color:var(--accent)}
.asec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow2)}
.asec>h2{display:flex;gap:10px;align-items:center;font-size:19px;margin-bottom:12px}
.asec>h2 .ic{color:var(--dc);width:22px;height:22px}
.asec>*+*{margin-top:12px}
.asec .card{box-shadow:none;background:var(--surface-2)}
.flow-link{margin-bottom:14px}
.builder{position:sticky;top:calc(var(--tb) + 16px);border-radius:var(--r12);padding:2px;background:var(--brand);box-shadow:var(--shadow16);max-height:calc(100vh - var(--tb) - 32px);display:flex}
.builder-in{background:var(--surface);border-radius:calc(var(--r12) - 2px);padding:16px;overflow:auto;width:100%;overscroll-behavior:contain}
.builder-wide{position:static;max-height:none;margin-top:24px}
.builder h2{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.builder h2 .ic{color:var(--accent)}
.builder h3{font-size:15px;margin:16px 0 8px;display:flex;gap:6px;align-items:center}
.b-intro{font-size:14px;color:var(--ink-2)}
.sites{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:6px}
.sites li{padding:8px 10px;border-radius:var(--r8);background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;line-height:1.45}
.sites a{font-weight:600;display:inline-flex;gap:4px;align-items:center}
.sites a .ic{width:14px;height:14px}
.sites span{display:block;color:var(--ink-2)}
.sites code{display:block;margin-top:2px;font-size:12px}
.b-note{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:16px;border:2px dashed var(--line);border-radius:var(--r8);background:var(--surface-2);cursor:pointer;transition:border-color var(--dur),background var(--dur);font-size:13.5px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:28px;height:28px;color:var(--accent)}
.drop small{color:var(--ink-2)}
.att{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.att li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px;border-radius:var(--r8);border:1px solid var(--line)}
.att li>div{flex:1;min-width:0}
.att b{display:block;word-break:break-all}
.att span{color:var(--ink-2)}
.att .err{color:var(--red)}
.bblocks{display:grid;gap:10px}
.copy-all{width:100%;margin-top:12px}
.src-badge{font-size:12px;color:var(--amber-t);background:var(--amber-soft);padding:4px 10px;border-radius:var(--r8);display:inline-block;margin-bottom:8px}

/* ---------- agent flow ---------- */
.flow-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.chatwin{border-radius:var(--r12);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow8);overflow:hidden}
.chatwin-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:600}
.chatwin-bar .ic{width:16px;height:16px;color:var(--accent)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.sim-tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--amber-t);background:var(--amber-soft);padding:2px 8px;border-radius:999px}
.chat{min-height:340px;max-height:520px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.6;box-shadow:var(--shadow2)}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.new{animation:bub .35s var(--ease-out)}
@keyframes bub{from{opacity:0;transform:translateY(6px) scale(.98)}}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.flow-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fsteps{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
.fsteps li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface);transition:background .3s,border-color .3s,transform .3s var(--ease-out)}
.fs-n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font:700 13px/1 var(--font-h);transition:background .3s,color .3s}
.fsteps li.on{border-color:var(--accent);background:var(--accent-soft);transform:translateX(4px)}
.fsteps li.on .fs-n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---------- module ---------- */
.module-hero{display:flex;gap:24px;align-items:center;margin-bottom:18px}
.module-num{font:700 clamp(64px,9vw,112px)/1 var(--font-h);letter-spacing:-.04em;opacity:.9}
.module-b .pill{margin-bottom:10px}
.module-boxes .card.prep{border-top:3px solid var(--amber)}
.module-boxes .card.goals{border-top:3px solid var(--green)}
.module-boxes .eyebrow{color:var(--ink)}
.wf{margin-top:8px}
.toc-cards{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.toc-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);height:100%;box-shadow:var(--shadow2);transition:box-shadow var(--dur),border-color var(--dur),transform var(--dur)}
.toc-card:hover{border-color:var(--dc);box-shadow:var(--shadow8);transform:translateY(-1px);color:var(--ink)}
.tc-ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r8);background:color-mix(in srgb,var(--dc) 14%,var(--surface))}
.tc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tc-b small{color:var(--ink-2);font-size:12px}
.tc-b b{font-weight:600;line-height:1.4}
.tc-s{font-size:13px;color:var(--ink-2);line-height:1.45}
.toc-card .ready{align-self:flex-start}
.agent-mini{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.agent-mini a{display:flex;gap:8px;align-items:center;font-size:14px;padding:5px 8px;border-radius:var(--r4);text-decoration:none}
.agent-mini a:hover{background:var(--surface-2)}
.agent-mini .ic{width:16px;height:16px}

/* ---------- handoff ---------- */
.handoff-diagram{display:grid;grid-template-columns:1fr auto 1.2fr auto 1fr;gap:10px;align-items:stretch}
.hd-col{padding:14px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow2)}
.hd-col ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.hd-col li{display:flex;gap:8px;align-items:center;font-size:14px}
.hd-col li .ic{color:var(--accent);width:18px;height:18px}
.hd-core{background:var(--accent-soft);border-color:transparent}
.hd-core-t{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.hd-core .chips li{background:var(--surface)}
.hd-arrow{display:grid;place-items:center;color:var(--accent)}

/* ---------- prompt builder ---------- */
.pb{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
.pb-form{display:grid;gap:12px;position:sticky;top:calc(var(--tb) + 16px)}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.pb-out{display:grid;gap:14px}
.pb-res pre{max-height:none}
.pb-res code{display:block}
.flash{animation:flash .6s var(--ease)}
@keyframes flash{from{background:var(--accent-soft)}}

/* ---------- calculators ---------- */
.calc{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
.calc-form{display:grid;gap:12px}
.num{display:flex;align-items:center;gap:8px}
.num span{font-size:13px;color:var(--ink-2);white-space:nowrap}
.calc-out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{padding:16px;border-radius:var(--r12);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow4);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--brand)}
.kpi-l{font-size:14px;color:var(--ink-2);font-weight:600}
.kpi-v{font:700 clamp(24px,3vw,34px)/1.1 var(--font-h);font-variant-numeric:tabular-nums;word-break:break-word}
.kpi-f{font:400 12px/1.4 var(--mono);color:var(--ink-2)}
.formula{grid-column:1/-1;display:flex;gap:8px;font-size:14px;color:var(--ink-2);padding:12px 14px;border-radius:var(--r8);background:var(--surface-2);margin:0}
.formula .ic{color:var(--accent);margin-top:3px}

/* ---------- home ---------- */
.hero{position:relative;border-radius:var(--r16);padding:clamp(28px,5vw,56px) clamp(20px,4vw,48px);overflow:hidden;background:radial-gradient(1200px 400px at 10% -10%,color-mix(in srgb,#1FA3E6 22%,transparent),transparent 60%),radial-gradient(900px 400px at 100% 0%,color-mix(in srgb,#8A55EA 18%,transparent),transparent 60%),radial-gradient(800px 400px at 60% 120%,color-mix(in srgb,#22BE97 18%,transparent),transparent 60%),var(--surface);border:1px solid var(--line);box-shadow:var(--shadow8)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center}
.hero .logo-chip img{height:46px}
.hero-word{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.hero-word h1{font:700 clamp(56px,7.4vw,124px)/.95 var(--font-h);letter-spacing:-.035em;color:var(--ink);padding-bottom:6px}
.hero-word .copilot-mark{height:clamp(52px,6.2vw,100px);width:auto;filter:drop-shadow(0 10px 24px rgba(138,85,234,.35));animation:float 6s ease-in-out infinite}
.hero-sub{font:700 clamp(22px,3vw,34px)/1.2 var(--font-h);margin:0 0 6px}
.hero-ev{font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:14px}
.hero-desc{font-size:17px;max-width:620px;color:var(--ink)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero-anim{width:100%;max-width:520px;justify-self:center}
.hero-anim .node rect{fill:var(--surface);stroke:var(--line)}
.hero-anim .node text{fill:var(--ink);font:600 15px var(--font-h)}
.hero-anim .node .sub{fill:var(--ink-2);font:400 11px var(--font)}
.hero-anim .node.agent rect{stroke:url(#hgrad);stroke-width:2.5}
.hero-anim .path{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 6}
.hero-anim .flow{fill:none;stroke:url(#hgrad);stroke-width:3;stroke-linecap:round;stroke-dasharray:18 300;animation:flow 3.2s linear infinite}
.hero-anim .pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.4s var(--ease) infinite}
.hero-anim .icon{color:var(--accent)}
@keyframes flow{from{stroke-dashoffset:318}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:.15}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0 8px}
.stat-tile{padding:16px 18px;border-radius:var(--r12);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2);display:flex;gap:12px;align-items:center}
.stat-tile .ic{width:28px;height:28px;color:var(--accent);flex:none}
.stat-tile b{display:block;font:700 30px/1 var(--font-h)}
.stat-tile span{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tool{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r12);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow2);transition:box-shadow var(--dur),transform var(--dur),border-color var(--dur)}
.tool:hover{box-shadow:var(--shadow8);transform:translateY(-2px);border-color:var(--accent);color:var(--ink)}
.tool .ti{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:var(--r8);background:var(--accent-soft);color:var(--accent)}
.tool b{display:block;font-family:var(--font-h);font-size:16px}
.tool small{color:var(--ink-2);font-size:13px;line-height:1.45;display:block}
.cgroup{margin-top:28px}
.cgroup>p{color:var(--ink-2);margin-top:-4px}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px 20px;border-radius:var(--r12);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow2);overflow:hidden;transition:box-shadow var(--dur),transform var(--dur)}
.ccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dc)}
.ccard:hover{box-shadow:var(--shadow8);transform:translateY(-2px);color:var(--ink)}
.ccard .cn{font:700 12px/1 var(--font-h);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.ccard .cn .ic{width:16px;height:16px}
.ccard b{font:700 16.5px/1.35 var(--font-h)}
.ccard small{color:var(--ink-2);font-size:13px}
.ccard .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:auto}
.ccard .bar i{display:block;height:100%;background:var(--dc);width:0;transition:width .5s var(--ease-out)}
.ccard.feature{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--brand) border-box;border:2px solid transparent}
.ccard .ill{position:absolute;right:-8px;bottom:-10px;width:70px;height:70px;color:var(--dc);opacity:.12}

/* ---------- directory / finder ---------- */
.dir-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.dir-ctl .input-ic{flex:1;min-width:220px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;font:500 13px/1.3 var(--font);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--dc)}
.fchip:hover{border-color:var(--dc)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.acard{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px 20px;border-radius:var(--r12);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2);overflow:hidden}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc)}
.acard:hover{box-shadow:var(--shadow8)}
.acard .ah{display:flex;gap:10px;align-items:flex-start}
.acard .av{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--dc) 15%,var(--surface));color:var(--dc)}
.acard h3{font-size:15.5px;line-height:1.35}
.acard h3 a{color:var(--ink);text-decoration:none}
.acard h3 a:hover{color:var(--accent)}
.acard h3 a::after{content:"";position:absolute;inset:0}
.acard .gid{font-size:12px;font-weight:700}
.acard p{font-size:13.5px;color:var(--ink-2);margin:0;line-height:1.5}
.acard .af{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.acard .af a{position:relative;z-index:1;font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--ink-2)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;animation:fade .15s}
.modal[hidden]{display:none}
.modal-box{width:100%;max-width:680px;background:var(--surface);border-radius:var(--r12);box-shadow:var(--shadow28);border:1px solid var(--line);overflow:hidden;animation:pop .2s var(--ease-out)}
.cmd-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmd-in .ic{color:var(--ink-2)}
.cmd-in input{border:0;padding:6px 0;font-size:17px;background:none}
.cmd-in input:focus{border:0;padding-bottom:6px}
#cmdList{list-style:none;margin:0;padding:6px;max-height:min(60vh,520px);overflow:auto}
#cmdList li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:var(--r8);cursor:pointer}
#cmdList li[aria-selected="true"]{background:var(--accent-soft)}
#cmdList .ri{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r8);background:color-mix(in srgb,var(--dc) 14%,var(--surface));color:var(--dc)}
#cmdList .rb{flex:1;min-width:0}
#cmdList b{display:block;font-weight:600;line-height:1.35}
#cmdList small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#cmdList mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px}
.cmd-foot{display:flex;flex-wrap:wrap;gap:14px;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.cmd-foot span:last-child{margin-left:auto}
.finder-box{max-width:1100px;max-height:84vh;display:flex;flex-direction:column}
.finder-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.finder-head h2{font-size:19px}
#finderBody{padding:16px 18px;overflow:auto}
.modal.finder{padding-top:6vh}

/* ---------- builder studio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.studio .card{display:grid;gap:12px}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl-row .cnt{font:500 12px var(--mono);color:var(--ink-2)}
.lbl-row .cnt.over{color:var(--red);background:none}
.url-row{display:flex;gap:8px;align-items:center}
.url-row .st{flex:none;width:22px;height:22px}
.url-row .st.ok{color:var(--green)}.url-row .st.bad{color:var(--red)}
.vmsg{font-size:12.5px;color:var(--red);margin:2px 0 0}
.vmsg.ok{color:var(--green-t)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.toggle input{width:40px;height:20px;appearance:none;-webkit-appearance:none;border-radius:999px;background:var(--line);position:relative;padding:0;border:0;cursor:pointer;transition:background var(--dur)}
.toggle input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform var(--dur) var(--ease)}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(20px)}
.toggle input:focus{border:0;padding:0}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:14px}
.checklist li{display:flex;gap:8px;align-items:center}
.checklist .ok{color:var(--green-t)}.checklist .no{color:var(--ink-2)}

/* ---------- progress ---------- */
.prog-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big-ring{width:150px;height:150px}
.big-ring circle{fill:none;stroke-width:12}
.big-ring .bgc{stroke:var(--line)}
.big-ring .fgc{stroke:url(#pgrad);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s var(--ease-out)}
.big-ring text{font:700 30px var(--font-h);fill:var(--ink)}
.big-ring .s{font:500 12px var(--font);fill:var(--ink-2)}
.pchap{display:grid;gap:8px}
.pchap a{display:grid;grid-template-columns:40px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.pchap a:hover{border-color:var(--dc)}
.pchap .n{font:700 14px var(--font-h)}
.pchap .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.pchap .bar i{display:block;height:100%;background:var(--dc)}
.pchap small{font-size:12.5px;color:var(--ink-2);text-align:right}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:var(--r8);box-shadow:var(--shadow28);font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.toast.show{animation:toast 2.6s var(--ease-out) forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}

/* ---------- illustration (decorative) ---------- */
.art-blob{animation:float 7s ease-in-out infinite}
.art-orbit{transform-origin:110px 110px;animation:spin 30s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- bottom bar (mobile) ---------- */
.bottombar{display:none}

/* ---------- responsive ---------- */
@media (max-width:1280px){.agent-layout{grid-template-columns:minmax(0,1fr) 400px}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){
  .agent-layout{grid-template-columns:minmax(0,1fr)}
  .builder{position:static;max-height:none}
  .flow-layout,.pb,.calc,.studio{grid-template-columns:minmax(0,1fr)}
  .pb-form{position:static}
  .tb-finder span,.tb-lbl{display:none}
  .btn-search{min-width:0}
}
@media (max-width:900px){
  :root{--tb:56px}
  .tb-menu{display:inline-flex}
  .sidebar{position:fixed;left:0;top:var(--tb);bottom:0;height:auto;z-index:35;transform:translateX(-102%);transition:transform .28s var(--ease-out);box-shadow:var(--shadow28);width:min(320px,88vw)}
  .sidebar.open{transform:none}
  .main{padding:20px 16px 110px}
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .hero-anim{max-width:420px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .handoff-diagram{grid-template-columns:minmax(0,1fr)}
  .hd-arrow{transform:rotate(90deg);height:24px}
  .bottombar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--acrylic);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottombar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:0;background:none;color:var(--ink);font:600 12px/1.2 var(--font);cursor:pointer;min-height:56px}
  .bottombar button:active{background:var(--surface-2)}
  .bottombar .ic{color:var(--accent)}
  .toast{bottom:80px}
  .ph{padding:20px 18px}
  .ph h1{max-width:100%}
  .ph-art{opacity:.25}
}
@media (max-width:640px){
  .brand-t small{display:none}
  .tb-finder{display:none}
  .logo-chip img{height:26px}
  .topbar{gap:6px;padding:0 8px}
  .tb-actions{gap:2px}
  .btn-search span,.btn-search kbd{display:none}
  .btn-search{width:40px;padding:0;justify-content:center}
  .tb-prog{display:none}
  .grid-2,.grid-3,.grid-4,.calc-out{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-tile{flex-direction:column;align-items:flex-start;gap:6px}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pager .nx{grid-column:1}
  .step{flex-direction:column;gap:10px}
  .module-hero{flex-direction:column;align-items:flex-start;gap:6px}
  .pchap a{grid-template-columns:32px minmax(0,1fr);}
  .pchap small{grid-column:2;text-align:left}
  .chain li{max-width:none}
  .chain li:not(:last-child)::after{display:none}
  .modal{padding:0}
  .modal-box{max-width:none;height:100%;max-height:none;border-radius:0}
  .finder-box{max-height:none}
  .hero-word h1{font-size:clamp(56px,17vw,84px)}
  .lede{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .hero-anim .flow{stroke-dasharray:none}
}
@media print{
  .topbar,.sidebar,.bottombar,.done-bar,.pager,.builder .drop,.btn-copy{display:none!important}
  .main{padding:0}
  body{background:#fff}
}

/* ===== v2 visual layer: brand, illustrations, hero scene ===== */
.brand-sep{width:1px;height:28px;background:var(--line);margin:0 2px}
.brand .copilot-mark{height:30px;width:30px}
.hero{padding:clamp(28px,5vw,60px) clamp(20px,4vw,52px)}
.hero::after{content:"";position:absolute;inset:auto -10% -40% auto;width:60%;height:80%;background:radial-gradient(closest-side,color-mix(in srgb,#F2B225 14%,transparent),transparent);pointer-events:none}
.hero-txt{position:relative;z-index:1}
.hero-art{position:relative;z-index:1;justify-self:center;width:100%;max-width:560px}
.hero-ev .pill{font-size:13px;background:var(--surface);}
.hero-scene{width:100%;height:auto;overflow:visible}
.hs-win{fill:var(--surface);stroke:var(--line);filter:drop-shadow(0 18px 40px rgba(20,26,47,.16))}
:root[data-theme="dark"] .hs-win{filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
.hs-bar{fill:var(--surface-2)}
.hs-url{fill:var(--surface)}
.il-card{fill:var(--surface);stroke:var(--line);filter:drop-shadow(0 4px 10px rgba(20,26,47,.12))}
.hs-line{fill:var(--line)}
.hs-ext{fill:#fff;font:700 12px var(--font-h)}
.hs-core{fill:var(--surface);stroke:var(--line)}
.hs-path{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:3 6}
.hs-flow{fill:none;stroke:url(#hsg);stroke-width:3;stroke-linecap:round;stroke-dasharray:16 260;animation:flow 2.4s linear infinite}
.hs-pulse{transform-origin:250px 180px;animation:pulse 2.6s var(--ease) infinite}
.hs-glow{animation:glow 5s ease-in-out infinite}
.hs-file{animation:float 6s ease-in-out infinite}
.hs-bub{animation:float 7s ease-in-out infinite;animation-delay:-2s}
.hs-res{animation:float 6.5s ease-in-out infinite;animation-delay:-3s}
.hs-n{fill:#fff;font:700 12px var(--font-h)}
.hs-step{fill:var(--ink);font:600 14px var(--font-h)}
@keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
/* group scenes */
.ph-art{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:300px;height:206px;pointer-events:none;opacity:1}
.ph{padding-right:300px;min-height:200px}
.ph-module{min-height:240px}
.ph-module .ph-art{width:360px;height:248px}
.il-spark{animation:twinkle 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.float1{animation:float 6s ease-in-out infinite}
.float2{animation:float 7s ease-in-out infinite;animation-delay:-2.5s}
.art-ring{transform-origin:214px 116px;animation:spin 40s linear infinite}
.il-core{filter:drop-shadow(0 10px 18px color-mix(in srgb,var(--dc) 40%,transparent))}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.ccard{padding-top:0}
.cc-art{display:block;margin:0 -16px 6px -20px;height:118px;background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 12%,var(--surface)),var(--surface) 70%);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.cc-svg{position:absolute;right:-6px;top:-10px;width:200px;height:138px}
.ccard:hover .cc-svg .il-core{transform:scale(1.04);transform-origin:214px 116px;transition:transform .3s var(--ease-out)}
.ccard .cn{margin-top:4px}
.stat-tile .st-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.stat-tile .st-ic .ic{width:24px;height:24px}
.stat-tile:nth-child(2) .st-ic{background:color-mix(in srgb,#22BE97 16%,var(--surface));color:var(--green-t)}
.stat-tile:nth-child(3) .st-ic{background:var(--amber-soft);color:var(--amber-t)}
.stat-tile:nth-child(4) .st-ic{background:color-mix(in srgb,#8A55EA 16%,var(--surface));color:color-mix(in srgb,#8A55EA 70%,var(--ink))}
.tool .ti{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,#8A55EA 14%,var(--surface)))}
.card,.asec,.step,.toc-card,.acard,.ccard,.tool,.stat-tile{border-radius:var(--r12)}
@media (max-width:1100px){.ph{padding-right:220px}.ph-art{width:230px;height:158px;right:-16px}.ph-module .ph-art{width:260px;height:180px}}
@media (max-width:900px){.ph{padding-right:18px;min-height:0}.ph-art{opacity:.22;width:220px;height:150px;right:-40px;top:0;transform:none}.hero-art{max-width:460px}}
@media (max-width:640px){.cc-art{height:96px}.cc-svg{width:160px;height:110px}.hero-word .copilot-mark{height:56px}}

/* ===== v3: Deep Learning, learning paths, live updates ===== */
:root{--g-d1:#2778CA;--g-d2:#1E8A72;--g-d3:#7650CF;--g-d4:#A86C1F;--g-d5:#B4486F;--g-d6:#4A6C96}
:root[data-theme="dark"]{--g-d1:#7FB6F0;--g-d2:#6FD3BC;--g-d3:#B9A0F5;--g-d4:#F0BE72;--g-d5:#F297B8;--g-d6:#9DB8DC}
.ver-line{text-align:center;color:var(--ink-2);font-size:12px;margin:4px 0 0}
.pill-ver{font-family:var(--mono)}
.sb-sec{display:flex;gap:6px;align-items:center;margin:14px 8px 6px;padding-top:12px;border-top:1px solid var(--line);font:700 12px/1.3 var(--font-h);letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase}
.sb-sec .ic{width:16px;height:16px;color:var(--accent)}
.hero-ev{display:flex;flex-wrap:wrap;gap:8px}

/* learning paths */
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.track{position:relative;display:flex;flex-direction:column;border-radius:var(--r12);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);overflow:hidden;box-shadow:var(--shadow2);transition:box-shadow var(--dur),transform var(--dur) var(--ease-out)}
.track:hover{box-shadow:var(--shadow16);transform:translateY(-3px);color:var(--ink)}
.track.star{grid-column:span 2;grid-row:span 2;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--brand) border-box;border:2px solid transparent}
.tr-art{display:block;height:120px;position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 14%,var(--surface)),var(--surface) 75%)}
.track.star .tr-art{height:230px}
.tr-svg{position:absolute;right:-4px;top:-8px;width:210px;height:144px}
.track.star .tr-svg{width:400px;height:276px;right:4%}
.tr-b{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.tr-b b{font:700 18px/1.3 var(--font-h)}
.track.star .tr-b b{font-size:28px}
.tr-b small{color:var(--ink-2);font-size:14px;line-height:1.5}
.tr-meta{font-size:12.5px;color:var(--ink-2);font-weight:600}
.tr-star{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:700 12px/1 var(--font-h);padding:5px 10px;border-radius:999px;background:var(--brand);color:#fff;letter-spacing:.02em}
.tr-star .ic{width:14px;height:14px}
.track .bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.track .bar i{display:block;height:100%;background:var(--dc)}
.track-steps{list-style:none;margin:0;padding:0;display:grid;gap:18px;position:relative}
.track-steps::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--dc),transparent)}
.tstep{position:relative}
.tstep-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tstep-h h2{font-size:20px}
.tstep .toc-cards{margin-left:52px}
.toc-card .dot{margin-top:8px}
.related{margin-top:28px;padding:16px 18px;border-radius:var(--r12);border:1px dashed color-mix(in srgb,var(--dc) 50%,var(--line));background:color-mix(in srgb,var(--dc) 5%,var(--surface))}
.related h2.sec{margin-top:0}
.rel-tracks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0;font-size:13.5px;color:var(--ink-2)}
.rel-tracks a.pill{text-decoration:none}
.rel-tracks a.pill:hover{border-color:var(--accent);color:var(--accent)}
.ph .related{margin:0}

/* deep lesson body (content from v10, restyled) */
.deep-body{display:grid;gap:16px}
.deep-body .deep-sec>section,.deep-body .deep-sec>.dl-anchor>section,.deep-w{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);padding:18px 20px;box-shadow:var(--shadow2);min-width:0}
.deep-body section section{border:0;box-shadow:none;padding:0;margin:14px 0 0;background:none}
.deep-body h2{display:flex;gap:10px;align-items:center;font-size:20px;margin:0 0 10px}
.deep-body h2 .ic{color:var(--dc)}
.deep-body section section h2{font-size:17px}
.deep-body h3{font-size:16.5px;margin:12px 0 6px}
.deep-body p{margin:0 0 .6em}
.deep-body ul,.deep-body ol{padding-left:22px;margin:0 0 .6em}
.deep-body li{margin:3px 0}
.deep-body .muted,.deep-body .tiny{color:var(--ink-2);font-size:14px}
.deep-body .flow{padding:10px 14px;border-radius:var(--r8);background:var(--accent-soft);font-weight:600;font-size:14.5px}
.deep-body .callout,.deep-body .box,.deep-body .deep-warning,.deep-body .warning{display:block;padding:12px 14px;border-radius:var(--r8);background:var(--surface-2);border:1px solid var(--line);margin:10px 0}
.deep-body .box.amber,.deep-body .deep-warning,.deep-body .warning{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.deep-body .box.green{background:var(--green-soft);border-color:transparent}
.deep-body .concept-grid,.deep-body .deep-concepts,.deep-body .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.deep-body .concept-grid>div,.deep-body .deep-concept,.deep-body .mini,.deep-body .card,.deep-body .example,.deep-body .deep-example,.deep-body .step{padding:12px 14px;border-radius:var(--r8);background:var(--surface-2);border:1px solid var(--line)}
.deep-body .deep-concept strong{display:block;font-family:var(--font-h);color:color-mix(in srgb,var(--dc) 74%,var(--ink));margin-bottom:4px}
.deep-body .deep-special{border-top:4px solid var(--dc)}
.deep-body .deep-special-tag,.deep-body .eyebrow,.deep-body .kicker{font:700 12px/1.3 var(--font-h);letter-spacing:.06em;color:color-mix(in srgb,var(--dc) 74%,var(--ink));margin-bottom:6px;text-transform:uppercase}
.deep-body .deep-steps{counter-reset:ds;list-style:none;padding:0;display:grid;gap:8px}
.deep-body .deep-steps li{counter-increment:ds;display:flex;gap:10px;padding:10px 12px;border-radius:var(--r8);background:var(--surface-2)}
.deep-body .deep-steps li::before{content:counter(ds);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font:700 13px/1 var(--font-h)}

.xd-l{font-size:13px;font-weight:600;color:var(--ink-2)}
.xd-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.xd-k small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.xd-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.xd-fig{margin:0;padding:12px;border-radius:var(--r12);border:1px solid var(--line);background:var(--surface);min-width:0}
.xd-fig figcaption{font-weight:700;margin-bottom:6px}
.xd-svg{width:100%;height:auto;display:block}
.xd-grid{stroke:var(--line);stroke-width:1}
.xd-ax{font-size:11px;fill:var(--ink-2)}
.xd-v{font-size:11px;font-weight:700;fill:var(--ink)}
.xd-tgt{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3}
.xd-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.xd-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.xd-leg i.tgt{background:none;border-top:2px dashed var(--ink);height:0;width:16px;border-radius:0;vertical-align:3px}
.xd-tbl-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.xd-tbl-h .input-ic{flex:0 1 300px}
.xd-t{min-width:760px}
.xd-t td{font-variant-numeric:tabular-nums}
@media (max-width:1100px){.xd-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.xd-charts{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.x-levels{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.xf-ctl,.xp-ctl{position:static}.xd-kpis{grid-template-columns:minmax(0,1fr)}.x-src{padding:12px 12px 4px}.xf{padding:12px}.x-cmp-r{grid-template-columns:70px 1fr 60px}}
.xd-t th{white-space:nowrap}

function xKpiRows(rows, chick) {
  return rows.map(r => { const live = r.Birds_Placed - r.Mortality_Cum; const gain = (r.Body_Weight_g - chick) / 1000 * live; return { ...r, Live: live, Gain: gain, FCR: gain > 0 ? r.Feed_Cum_kg / gain : null, Mort: r.Birds_Placed > 0 ? r.Mortality_Cum / r.Birds_Placed * 100 : null }; });

function xQuality(rows, reportDate) {
  const w = []; const seen = new Map();
  rows.forEach((r, i) => {
    const at = `แถว ${i + 2}`;
    for (const c of XCOLS) if (r[c] === '' || r[c] == null || (typeof r[c] === 'number' && Number.isNaN(r[c]))) w.push(`${at}: ${c} ว่างหรือไม่ใช่ตัวเลข`);
    if (['Body_Weight_g', 'Feed_Cum_kg', 'Mortality_Cum', 'Birds_Placed', 'Age_Days'].some(c => r[c] < 0)) w.push(`${at}: มีค่าติดลบ`);
    if (r.Date && reportDate && r.Date > reportDate) w.push(`${at}: วันที่ ${r.Date} เกินวันรายงาน ${reportDate}`);
    const k = r.Farm_ID + '|' + r.Date; if (seen.has(k)) w.push(`${at}: ข้อมูลซ้ำกับแถว ${seen.get(k)} (Farm_ID + Date)`); else seen.set(k, i + 2);
  });

}
function xParseSheet(XL, wb) {
  const name = wb.SheetNames.includes('Raw_Data') ? 'Raw_Data' : wb.SheetNames[0];

  const head = aoa[hi].map(h => String(h).trim()); const miss = XCOLS.filter(c => !head.includes(c));
