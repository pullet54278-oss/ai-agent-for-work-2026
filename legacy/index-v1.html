<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Copilot AI Agents for Work 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — module TOC rail · 16:9 slide stage · Learn-mode deep-dive panel under the slide */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --surface-2:#F4F6FD; --ink:#141A2F; --ink-2:#4E5672; --line:#DADFEE;
  --accent:#2557E0; --accent-ink:#FFFFFF; --accent-soft:#E2E9FD;
  --amber:#A3650A; --amber-soft:#FBEBCB; --red:#C23B5A;
  --brand:linear-gradient(115deg,#1F5BE3 0%,#1FA3E6 24%,#22BE97 44%,#F2B225 62%,#EE5A7C 80%,#8A55EA 100%);
  --c-gen:#5D6684; --c-data:#2557E0; --c-farm:#178F6B; --c-inv:#A96F05; --c-fin:#0A86B8; --c-sales:#CF3D69; --c-eng:#7A4FDB; --c-ci:#CF5A22; --c-rep:#4A58B0;
  --logo-bg:transparent; --logo-pad:0;
  --wm:linear-gradient(100deg,#1F5BE3 0%,#0A8FC2 22%,#119473 42%,#B98200 60%,#D2386F 80%,#7A44D8 100%);
  --hero-bg:linear-gradient(135deg,rgba(31,91,227,.10),rgba(34,190,151,.08) 40%,rgba(242,178,37,.08) 65%,rgba(138,85,234,.10));
  --c-pb:#B4532A; --c-hat:#B07A12; --c-brl:#2E8B57; --c-lp:#2F6FB5; --c-erp:#6B5BB8; --c-feed:#87661A; --c-lab:#0E8686; --c-qms:#A83A6B; --c-cis:#3E7D3A;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F1E; --surface:#121931; --surface-2:#18213C; --ink:#E6EAF8; --ink-2:#A1AAC8; --line:#28324F;
  --accent:#7EA2FF; --accent-ink:#0A1230; --accent-soft:#1D2B57;
  --amber:#F0B44A; --amber-soft:#3A2D12; --red:#F27C98;
  --c-gen:#9AA3C2; --c-data:#7EA2FF; --c-farm:#4FD1A8; --c-inv:#F0B44A; --c-fin:#4CC3EE; --c-sales:#F57FA2; --c-eng:#B395FF; --c-ci:#F59468; --c-rep:#98A3F0;
  --logo-bg:#F4F6FD; --logo-pad:4px 8px;
  --wm:linear-gradient(100deg,#7EA2FF 0%,#4CC3EE 22%,#4FD1A8 42%,#F2C14E 60%,#F57FA2 80%,#B395FF 100%);
  --hero-bg:linear-gradient(135deg,rgba(126,162,255,.14),rgba(79,209,168,.10) 40%,rgba(242,193,78,.08) 65%,rgba(179,149,255,.14));
  --c-pb:#F0936A; --c-hat:#F2BE5C; --c-brl:#6FD39A; --c-lp:#7FB2F2; --c-erp:#B3A6F2; --c-feed:#D9B865; --c-lab:#5ED1D1; --c-qms:#F08DB8; --c-cis:#8FD48A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0F1E; --surface:#121931; --surface-2:#18213C; --ink:#E6EAF8; --ink-2:#A1AAC8; --line:#28324F;
  --accent:#7EA2FF; --accent-ink:#0A1230; --accent-soft:#1D2B57;
  --amber:#F0B44A; --amber-soft:#3A2D12; --red:#F27C98;
  --c-gen:#9AA3C2; --c-data:#7EA2FF; --c-farm:#4FD1A8; --c-inv:#F0B44A; --c-fin:#4CC3EE; --c-sales:#F57FA2; --c-eng:#B395FF; --c-ci:#F59468; --c-rep:#98A3F0;
  --logo-bg:#F4F6FD; --logo-pad:4px 8px;
  --wm:linear-gradient(100deg,#7EA2FF 0%,#4CC3EE 22%,#4FD1A8 42%,#F2C14E 60%,#F57FA2 80%,#B395FF 100%);
  --hero-bg:linear-gradient(135deg,rgba(126,162,255,.14),rgba(79,209,168,.10) 40%,rgba(242,193,78,.08) 65%,rgba(179,149,255,.14));
  --c-pb:#F0936A; --c-hat:#F2BE5C; --c-brl:#6FD39A; --c-lp:#7FB2F2; --c-erp:#B3A6F2; --c-feed:#D9B865; --c-lab:#5ED1D1; --c-qms:#F08DB8; --c-cis:#8FD48A;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:16px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.tbtn:hover{border-color:var(--accent)}
.prog{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.prog i{display:block;width:80px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--accent);width:0}
.only-narrow{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 60px)}
.toc{border-right:1px solid var(--line);background:var(--surface);padding:14px 12px 40px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
.toc input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font:inherit;font-size:13px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc,var(--ink-2))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mod{border-top:1px solid var(--line)}
.mod summary{list-style:none;padding:9px 4px;display:flex;gap:8px;align-items:baseline;font-size:13px;font-weight:600}
.mod summary::-webkit-details-marker{display:none}
.mod summary .mn{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);min-width:22px}
.mod summary .mt{flex:1;min-width:0}
.mod summary .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.sl{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:5px 6px 5px 30px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.sl:hover{background:var(--surface-2);color:var(--ink)}
.sl[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.sl .n{font-family:var(--f-mono);font-size:11px;min-width:20px;padding-top:2px;font-variant-numeric:tabular-nums}
.sl .t{flex:1;min-width:0}
.sl .v{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;border:1.5px solid var(--line)}
.sl .v.on{background:var(--accent);border-color:var(--accent)}
.sl .core{font-size:10px;color:var(--amber);padding-top:2px}
.flat .sl{padding-left:6px}
.legend{margin-top:16px;font-size:11.5px;color:var(--ink-2);display:grid;gap:4px}

/* ---------- stage ---------- */
main{padding-block:20px 60px;padding-inline:24px;min-width:0}
.stage{max-width:1180px;margin:0 auto}
.navbar{display:flex;align-items:center;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.navbar .count{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-right:auto}
.navbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.navbtn:disabled{opacity:.4;cursor:default}
body.present .toc{display:none}
body.present .shell{grid-template-columns:minmax(0,1fr)}
body.present .stage{max-width:min(1500px,calc((100vh - 170px) * 16 / 9))}
body.present .deep{display:none}

/* ---------- slide ---------- */
.slide{container:slide/inline-size;background:var(--surface);border:1px solid var(--line);border-radius:14px;position:relative;width:100%}
.si{--xs:12.5px;--s:14.5px;--m:16px;--l:clamp(18px,2.3cqw,22px);--xl:clamp(27px,3.8cqw,40px);--xxl:clamp(34px,5.6cqw,58px);
  --pad:clamp(18px,4.5cqw,52px);padding:var(--pad);display:flex;flex-direction:column;gap:22px;font-size:var(--m);line-height:1.7}
.shead{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:var(--xs);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.shead .dep{color:var(--dc,var(--accent));font-weight:500}
.sfoot{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font-size:var(--xs);color:var(--ink-2);border-top:1px solid var(--line);padding-top:max(6px,.8cqw)}
.si h1,.si h2{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.005em}
.si h1{font-size:var(--xl);font-weight:700}
.si h2{font-size:var(--l);font-weight:600}
.si p{margin:0}
.lede{color:var(--ink-2);font-size:var(--m);max-width:60ch}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--xs);font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.r-concept{color:var(--ink-2)} .r-assist{color:var(--accent)} .r-connected{color:var(--amber)}
.badge.draft{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.sim{font-size:var(--xs);color:var(--ink-2);font-style:italic}
.row{display:flex;gap:max(10px,1.4cqw);flex-wrap:wrap;align-items:center}

/* cover */
.cover{justify-content:space-between}
.cover .kick{font-family:var(--f-mono);font-size:var(--s);color:var(--accent);letter-spacing:.06em}
.cover h1{font-size:var(--xxl);max-width:16ch}
.cover .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:max(10px,1.4cqw);border-top:1px solid var(--line);padding-top:max(12px,1.6cqw)}
.cover .facts b{display:block;font-family:var(--f-display);font-size:var(--xl);line-height:1.1;font-variant-numeric:tabular-nums}
.cover .facts span{font-size:var(--s);color:var(--ink-2)}
.depbar{display:flex;height:max(6px,.6cqw);border-radius:3px;overflow:hidden}
.depbar i{flex:1;background:var(--dc)}

/* schedule */
.tline{display:flex;gap:2px;height:max(40px,5cqw);border-radius:6px;overflow:hidden}
.tline div{background:color-mix(in srgb,var(--dc) 22%,var(--surface));border-top:3px solid var(--dc);padding:4px 6px;font-size:var(--xs);font-family:var(--f-mono);min-width:0;overflow:hidden;white-space:nowrap;color:var(--ink)}
.tline .brk{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 7px);border-top-color:var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--s)}
.tbl th,.tbl td{text-align:left;padding:max(4px,.55cqw) max(6px,.8cqw);border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:var(--xs);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:500}
.tbl td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dc);margin-right:6px}
.scroll{overflow-x:auto;min-width:0}

/* grids */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:max(10px,1.4cqw)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:max(10px,1.4cqw)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:max(10px,1.4cqw)}
.panel{background:var(--surface-2);border-radius:8px;padding:max(10px,1.3cqw);min-width:0}
.panel h3{margin:0 0 4px;font-family:var(--f-display);font-size:var(--m);font-weight:600}
.panel p,.panel li{font-size:var(--s);color:var(--ink-2)}
.panel ul{margin:0;padding-left:1.1em}
.k{font-family:var(--f-mono);font-size:var(--xs);color:var(--accent);letter-spacing:.05em}

/* anatomy */
.anat{display:grid;grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:auto auto auto;gap:max(8px,1.1cqw);align-items:stretch;flex:1}
.anat .core{grid-column:2;grid-row:1/4;border:2px solid var(--accent);border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:max(12px,1.6cqw);background:var(--accent-soft)}
.anat .core b{font-family:var(--f-display);font-size:var(--l)}
.anat .core span{font-size:var(--s);color:var(--ink-2)}
.anat .core .io{margin-top:max(8px,1cqw);font-family:var(--f-mono);font-size:var(--xs)}

/* readiness */
.stairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:max(10px,1.4cqw);align-items:end;flex:1}
.step{border-radius:8px;padding:max(10px,1.3cqw);background:var(--surface-2);border-top:4px solid currentColor;display:flex;flex-direction:column;gap:6px}
.step:nth-child(1){min-height:55%} .step:nth-child(2){min-height:75%} .step:nth-child(3){min-height:95%}
.step b{font-family:var(--f-display);font-size:var(--l);color:var(--ink)}
.step .cnt{font-family:var(--f-display);font-size:var(--xxl);line-height:1;font-variant-numeric:tabular-nums}
.step p{font-size:var(--s);color:var(--ink-2)}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:max(6px,.8cqw);flex:1}
.mcol{border-top:3px solid var(--dc);background:var(--surface-2);border-radius:0 0 6px 6px;padding:max(6px,.8cqw);display:flex;flex-direction:column;gap:max(4px,.5cqw);min-width:0}
.mcol h3{font-size:var(--xs);margin:0 0 2px;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--dc)}
.mcol button{border:1px solid var(--line);background:var(--surface);border-radius:6px;text-align:left;padding:max(4px,.5cqw) max(6px,.6cqw);font-size:var(--xs);line-height:1.35}
.mcol button:hover{border-color:var(--dc)}
.mcol button span{font-family:var(--f-mono);color:var(--ink-2);margin-right:4px}

/* agent case slide */
.ahead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ahead > div{min-width:0}
.ahead .lede{margin-top:4px}
.flow{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.5fr) auto minmax(0,.8fr);align-items:center;gap:max(6px,.8cqw);background:var(--surface-2);border-radius:10px;padding:max(10px,1.4cqw);position:relative}
.files,.outs{display:flex;flex-direction:column;gap:max(4px,.5cqw)}
.file{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:max(4px,.45cqw) max(6px,.7cqw);font-family:var(--f-mono);font-size:var(--xs);min-width:0;overflow-wrap:anywhere}
.file::before{content:"";width:max(8px,.8cqw);height:max(10px,1cqw);flex:none;border:1.5px solid var(--dc,var(--accent));border-radius:2px}
.outs .file{border-color:var(--accent);background:var(--accent-soft)}
.outs .file::before{border-color:var(--accent);background:var(--accent)}
.wire{width:max(18px,3cqw);height:2px;background:var(--line);position:relative;overflow:hidden}
.wire::after{content:"";position:absolute;top:-2px;left:-30%;width:30%;height:6px;border-radius:3px;background:var(--accent);animation:travel 1.8s linear infinite}
@keyframes travel{to{left:100%}}
.agentbox{border:2px solid transparent;border-radius:10px;padding:max(8px,1.1cqw);background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--brand) border-box;text-align:center;min-width:0}
.agentbox b{font-family:var(--f-display);font-size:var(--m);display:block}
.pipe{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px;font-family:var(--f-mono);font-size:var(--xs)}
.pipe span{padding:1px 7px;border-radius:4px;background:var(--accent-soft)}
.pipe i{font-style:normal;color:var(--ink-2)}
.sim-tag{position:absolute;right:max(8px,1cqw);bottom:max(4px,.4cqw)}
.atabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.atabs button{border:0;background:transparent;padding:max(5px,.6cqw) max(8px,1cqw);font-size:var(--s);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--ink-2)}
.atabs button[aria-selected="true"]{border-color:var(--accent);color:var(--ink);font-weight:600}
.apane{font-size:var(--m);min-height:max(60px,7cqw)}
.apane ul,.apane ol{margin:0;padding-left:1.2em}
.apane .h{font-weight:600;color:var(--accent);font-size:var(--s);margin-bottom:2px;display:block}

/* agentflow slide */
.af{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:max(10px,1.6cqw);flex:1;min-height:0}
.mock{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-2);min-height:0}
.mock .bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:var(--xs);color:var(--ink-2);background:var(--surface)}
.mock .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mock .bar span{margin-left:6px}
.chat{padding:max(8px,1cqw);display:flex;flex-direction:column;gap:max(6px,.7cqw);flex:1;overflow:auto;max-height:max(220px,26cqw)}
.bub{font-size:var(--s);padding:max(6px,.7cqw) max(8px,1cqw);border-radius:10px;max-width:92%;line-height:1.5}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.bub.a b{color:var(--accent)}
.bub.new{animation:pop .35s ease-out}
@keyframes pop{from{opacity:.2;transform:translateY(6px)}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:max(4px,.55cqw);counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:max(24px,2.4cqw) 1fr;gap:max(6px,.8cqw);align-items:start;font-size:var(--s);padding:max(4px,.5cqw);border-radius:8px;transition:background .3s}
.steps li::before{content:counter(st);display:grid;place-items:center;width:max(22px,2.2cqw);height:max(22px,2.2cqw);border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-mono);font-size:var(--xs);transition:all .3s}
.steps li.on{background:var(--accent-soft)}
.steps li.on::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.play{align-self:flex-start;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:max(4px,.5cqw) max(10px,1.2cqw);font-size:var(--s);font-weight:600}
.play:hover{background:var(--accent);color:var(--accent-ink)}

/* module divider */
.modhero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:max(16px,3cqw);align-items:start;flex:1}
.modno{font-family:var(--f-display);font-weight:700;font-size:max(64px,13cqw);line-height:.85;color:var(--dc);font-variant-numeric:tabular-nums}
.alist{display:flex;flex-direction:column;gap:max(5px,.6cqw)}
.alist button{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:max(6px,.7cqw) max(10px,1.1cqw);text-align:left;font-size:var(--m)}
.alist button:hover{border-color:var(--dc)}
.alist .an{font-family:var(--f-mono);font-size:var(--xs);color:var(--ink-2);margin-right:8px}

/* matrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx .req{color:var(--accent);font-size:var(--m)}
.mx .opt{color:var(--ink-2)}

/* outline */
.outline-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:max(8px,1cqw)}
.outline-list li{display:grid;grid-template-columns:max(28px,3cqw) 1fr;gap:10px;font-size:var(--m);padding-bottom:max(8px,1cqw);border-bottom:1px dashed var(--line)}
.outline-list li span{font-family:var(--f-mono);font-size:var(--s);color:var(--dc,var(--accent))}


/* Copilot-gradient accents and new slide types */
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--brand)}
.bmark{width:30px;height:30px;border-radius:9px;background:var(--brand);flex:none}
.gbar{height:max(6px,.6cqw);border-radius:3px;background:var(--brand)}
.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:max(4px,.5cqw)}
.ck li{display:grid;grid-template-columns:1.5em 1fr;font-size:var(--s)}
.ck .y{color:var(--c-farm)} .ck .x{color:var(--red)}
.how{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--s)}
.how span{background:var(--accent-soft);border-radius:6px;padding:2px 10px}
.how i{font-style:normal;color:var(--ink-2)}
.bsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:max(8px,1cqw);flex:1}
.bstep{background:var(--surface-2);border-radius:8px;padding:max(8px,1cqw);display:flex;flex-direction:column;gap:4px;min-width:0}
.bstep .no{width:max(24px,2.4cqw);height:max(24px,2.4cqw);border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:var(--xs);font-weight:600}
.bstep b{font-size:var(--s);font-family:var(--f-display)}
.bstep p{font-size:var(--xs);color:var(--ink-2)}
.bstep .std{font-size:var(--xs);color:var(--amber);font-weight:500;margin-top:auto}
.app{border-top:4px solid var(--ac)}
.app h3{margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:var(--xs);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.story{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.story li{display:flex;gap:8px;font-size:var(--s);background:var(--surface);border-radius:6px;padding:4px 8px}
.story li b{font-family:var(--f-mono);font-size:var(--xs);color:var(--accent);padding-top:2px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:max(12px,1.8cqw);flex:1}
.cin{display:flex;flex-direction:column;gap:max(8px,1cqw)}
.cin label{display:flex;flex-direction:column;gap:3px;font-size:var(--s);color:var(--ink-2)}
.cin input{font-family:var(--f-mono);font-size:var(--m);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.res{display:flex;flex-direction:column;gap:max(6px,.8cqw);background:var(--surface-2);border-radius:10px;padding:max(10px,1.4cqw)}
.res div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px;font-size:var(--s)}
.res b{font-family:var(--f-display);font-size:var(--l);font-variant-numeric:tabular-nums;white-space:nowrap}
.res .big b{color:var(--red);font-size:var(--xl)}
.formula{font-family:var(--f-mono);font-size:var(--xs);color:var(--ink-2)}
.bmark{border:0;padding:0;cursor:pointer;overflow:hidden;display:grid;place-items:center}
.bmark.has{background:transparent}
.bmark img{width:100%;height:100%;object-fit:contain}
.tbl td.ok{color:var(--c-farm);font-weight:500} .tbl td.no{color:var(--red);font-weight:500}
.panel.lic{background:var(--accent-soft)}
.ptabs{display:flex;flex-wrap:wrap;gap:4px}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:var(--xs)}
.ptabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ppane{flex:1}
.pp{background:var(--surface-2);border-radius:8px;padding:max(8px,1cqw);display:flex;flex-direction:column;gap:6px;min-width:0}
.pp p{font-size:var(--s);font-family:var(--f-mono)}
.copy2{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:12px}
.copy2:hover{border-color:var(--accent)}
.blk{margin-bottom:12px}
.blkh{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.blkh b{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--accent)}
.blkh span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.blkh .copy2{margin-left:auto}
.blk pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:420px;overflow:auto}

/* reading-page layout */
.stage{max-width:1100px}
.si h1{font-size:var(--xl);font-weight:700;letter-spacing:-.01em}
.si h2{font-size:var(--l);font-weight:700;margin:0 0 10px}
.si .lede{font-size:17px;max-width:68ch}
.si .lede.big{font-size:clamp(17px,2.1cqw,20px);color:var(--ink);font-weight:500;margin-top:10px}
.si p{max-width:72ch}
.sfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.shead{font-size:12px}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.pcard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;min-width:0}
.pcard span{font-size:12.5px;color:var(--ink-2);font-weight:500}
.pcard b{font-family:var(--f-display);font-size:16px;line-height:1.35}
.pcard.next{text-align:right;border-color:var(--accent);background:var(--accent-soft)}
.pcard:hover{border-color:var(--accent)}
.sel{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);margin:10px 0 12px}
.sel select{font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
/* home */
.home .hero{display:flex;flex-direction:column;gap:16px;padding-block:8px 4px}
.home h1{font-size:var(--xxl);line-height:1.08;max-width:16ch}
.home .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-block:1px solid var(--line);padding-block:16px}
.home .facts b{display:block;font-family:var(--f-display);font-size:var(--xl);line-height:1.05;font-variant-numeric:tabular-nums}
.home .facts span{font-size:13.5px;color:var(--ink-2)}
.cta{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;border-radius:10px;padding:12px 20px}
.cta.sm{font-size:14px;padding:8px 14px}
.ghost{border:1px solid var(--line);background:transparent;font-weight:500;font-size:15px;border-radius:10px;padding:11px 18px}
.cta:hover{filter:brightness(1.08)} .ghost:hover{border-color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--dc);background:var(--surface-2);border-radius:10px;padding:12px 14px;min-width:0}
.mcard:hover{background:var(--surface);border-color:var(--dc)}
.mcard .mn{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.mcard b{font-family:var(--f-display);font-size:16px;line-height:1.3}
.mcard .mm{font-size:13px;color:var(--ink-2)}
.mcard.feat{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--accent)}
/* prompt mode */
.psteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.pstepcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:12px;padding:16px}
.pnum{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.pbody h2{margin:0}
.ptxt{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:13.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.pp{gap:8px}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.callout b{font-family:var(--f-display);font-size:17px}
.callout span{flex:1;min-width:200px;color:var(--ink-2)}
.ph{font-family:var(--f-display);font-size:16px;margin:0 0 6px}
.plist{display:flex;flex-direction:column;gap:10px}
.pbgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}
.pbform{display:flex;flex-direction:column;gap:12px}
.pbform label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.pbform input,.pbform textarea,.pbform select{font:inherit;font-weight:400;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.pbout{display:flex;flex-direction:column;gap:12px;min-width:0}
.pblk{display:flex;flex-direction:column;gap:6px}
.pblk b{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);letter-spacing:.03em}
.pblk pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.steps.big li{font-size:15.5px}
/* handoff */
.hflow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:16px}
.hcol{display:flex;flex-direction:column;gap:6px}
.note{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--amber);padding-left:10px}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
/* workflow chain */
.pflow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.pstep{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-top:3px solid var(--dc);border-radius:8px;padding:10px 12px;min-width:150px;flex:1}
.pst{font-weight:600;font-size:14.5px}
.pstep button{border:1px solid var(--dc);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12.5px;text-align:left;color:var(--ink)}
.pstep button:hover{background:color-mix(in srgb,var(--dc) 14%,var(--surface))}
.pstep i{font-size:12.5px;color:var(--ink-2)}
.parr{align-self:center;color:var(--ink-2);font-weight:400}
@container slide (max-width: 640px){
  .pbgrid,.home .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pbgrid{grid-template-columns:minmax(0,1fr)}
  .hflow{grid-template-columns:minmax(0,1fr)}
  .pstepcard{grid-template-columns:minmax(0,1fr)}
  .parr{display:none}
}
@media (max-width: 560px){.pager{grid-template-columns:minmax(0,1fr)}}

/* plain content pages */
.slide{background:transparent;border:0;border-radius:0}
.si{padding-inline:0;padding-block:4px 8px}
.shead{text-transform:none;letter-spacing:.02em;font-family:var(--f-body);font-size:13px}
.doc .dsec h3{font-family:var(--f-display);font-size:20px;margin:0 0 8px}
.dsec{min-width:0}
.dsec ul,.dsec ol{margin:0;padding-left:1.3em}
.dsec li{margin-bottom:4px}
.dsec .gen{font-size:12px;color:var(--amber);background:var(--amber-soft);display:inline-block;padding:2px 8px;border-radius:4px;margin-bottom:10px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13.5px}
.jump button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.buildbox{border:2px solid transparent;border-radius:14px;padding:clamp(16px,3cqw,28px);background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--brand) border-box;display:flex;flex-direction:column;gap:12px;scroll-margin-top:80px}
.buildbox h2{font-size:var(--l);margin:0}
.buildbox>p{margin:0;color:var(--ink-2)}
.buildbox h3{font-family:var(--f-display);font-size:18px;margin:8px 0 4px}
.drop{border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer}
.drop b{font-size:16px}
.drop span{font-size:13px;color:var(--ink-2);max-width:60ch}
.drop.over,.drop:hover{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.drop:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.attlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.attlist li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface-2)}
.attlist li b{font-size:14px;overflow-wrap:anywhere}
.attlist li span{font-size:12.5px;color:var(--ink-2);flex:1;min-width:160px}
.attlist .copy2{align-self:center}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.arch div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.arch b{display:block;font-size:12px;font-family:var(--f-mono);color:var(--accent);letter-spacing:.04em}
.arch p{font-size:13.5px;margin:4px 0 0;color:var(--ink-2)}

.websrc{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:10px;padding:14px 16px}
.wsh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.wsh h3{margin:0;font-family:var(--f-display);font-size:17px}
.wlist{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.wlist li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.wlist a{color:var(--accent);font-weight:600}
.wlist span{font-size:13.5px;color:var(--ink-2)}
.wlist code,.tbl code{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;flex-basis:100%}
.tbl a{color:var(--accent);font-weight:600}

.asec h2{font-size:var(--l);margin:0 0 6px}
.asec p{margin:0 0 8px}
.alist2{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px}
.alist2 li{line-height:1.65}
.extra{display:flex;flex-direction:column;gap:14px;border-top:1px dashed var(--line);padding-top:16px}
.extra>.k{font-size:12px}
.mintro{font-size:16.5px;max-width:70ch;margin:0}
.prep{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.prep b{font-family:var(--f-display);font-size:15px}
.prep ul{margin:6px 0 0;padding-left:1.2em}
.h4{font-family:var(--f-display);font-size:16px;margin:14px 0 6px}

/* ---------- refreshed UI ---------- */
.stage{max-width:1320px}
.wm{background:var(--wm);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:var(--f-display);font-weight:700;letter-spacing:.04em}
.brand b.wm{font-size:17px;letter-spacing:.06em}
.wm.big{font-size:clamp(40px,7.2cqw,84px);line-height:.98;letter-spacing:.02em;margin:6px 0 8px;max-width:none}
.eyebrow{display:inline-block;font-size:12.5px;font-weight:600;color:var(--dc);letter-spacing:.04em;margin-bottom:2px}
.cmdbtn{display:inline-flex;align-items:center;gap:8px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface);color:var(--ink-2)}
.home .hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--hero-bg);border-radius:20px;padding:clamp(20px,4cqw,44px)}
.home .htext{display:flex;flex-direction:column;gap:12px;min-width:0}
.kick{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.hvis{display:flex;flex-direction:column;gap:14px;min-width:0}
.hvis img{width:100%;border-radius:14px;display:block;aspect-ratio:2/1;object-fit:cover;background:var(--surface-2)}
.hflow2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.hflow2 span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.hflow2 span.ag{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--brand) border-box}
.hflow2 i{width:28px;height:2px;background:var(--line);position:relative;overflow:hidden}
.hflow2 i::after{content:"";position:absolute;top:-2px;left:-40%;width:40%;height:6px;border-radius:3px;background:var(--accent);animation:travel 1.6s linear infinite}
.mgroup{display:flex;flex-direction:column;gap:12px}
.mgroup h2{margin:0}
.gsub{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}
.mbar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:var(--dc)}
.mcard{transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--dc) 18%,transparent)}
.agrid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
.acol{display:flex;flex-direction:column;gap:22px;min-width:0}
.aside{min-width:0;scroll-margin-top:80px}
.aside .buildbox{gap:12px}
@container slide (min-width: 980px){
  .agrid{grid-template-columns:minmax(0,1fr) minmax(0,440px)}
  .aside{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;border-radius:14px}
  .aside .g3{grid-template-columns:minmax(0,1fr)}
}
.mod{border-left:3px solid transparent}
.mod[open]{border-left-color:var(--dc)}
.mod summary{align-items:center}
.ring{width:18px;height:18px;border-radius:50%;flex:none;background:conic-gradient(var(--dc) calc(var(--p)*1%),var(--line) 0);-webkit-mask:radial-gradient(circle 5px,transparent 98%,#000 100%);mask:radial-gradient(circle 5px,transparent 98%,#000 100%)}
.sl .v.seen{border-color:var(--accent)}
.donebar{display:flex;justify-content:center;margin-top:18px}
.donebtn{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:9px 18px;font-weight:600;font-size:14.5px}
.donebtn.is{border-style:solid;background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

  full:{
   arch:{Instructions:'สูตร COPQ, การแยก Internal/External Failure, ห้ามสรุปสาเหตุ',Knowledge:'นิยาม KPI (CONG, FCR, Mortality, Hatchability), ตารางต้นทุนมาตรฐาน',Tools:'การวิเคราะห์ Excel ใน Copilot, (ต่อยอด) Power BI',Permissions:'ข้อมูลคุณภาพและต้นทุนตามสิทธิ์ของผู้ใช้',Verification:'ผู้รับผิดชอบด้านบัญชียืนยันสมมติฐาน, สุ่มตรวจ 3 ประเด็นกับเอกสารต้นทาง'},
   prompt:`บทบาท: คุณคือ Standard and Regulatory Agent ช่วยทีมคุณภาพแปลงปัญหาคุณภาพเป็นมูลค่าทางการเงิน
ข้อมูล: NC & Complaint Log, CAPA Register, CONG KPI, Mortality, FCR, Hatchability, Feed Quality และตารางต้นทุนมาตรฐาน

ขั้นตอน:
1. เชื่อมรายการ NC/Complaint กับฟาร์ม ล็อต และเดือนเดียวกัน รายงานรายการที่เชื่อมไม่ได้
2. คำนวณผลกระทบทางการเงินแยกตามประเภท:
   - Customer Claim = มูลค่าที่ลูกค้าเรียกร้องจริง
   - Mortality = (อัตราตายจริง − เป้า) × จำนวนลงเลี้ยง × ต้นทุนสะสมต่อตัว
   - FCR = (FCR จริง − FCR เป้า) × น้ำหนักไก่เป็นรวม × ราคาอาหารต่อ กก.
   - Hatchability = (เป้า − จริง) × จำนวนไข่เข้าฟัก × มูลค่าลูกไก่ต่อตัว
3. รวมเป็น COPQ แยก Internal Failure และ External Failure
4. จัดอันดับ 10 ประเด็นตามมูลค่า พร้อมสถานะ CAPA (เปิด/ปิด/เลยกำหนด)
5. สรุปผู้บริหารไม่เกิน 1 หน้า และแสดงตารางสมมติฐานที่ใช้คำนวณ

ข้อห้าม: ห้ามสรุปสาเหตุของปัญหา ห้ามเดาราคาหรือต้นทุนที่ไม่มีในไฟล์ ให้ถามก่อน`,

function calc(){
  const v=id=>{const e=document.getElementById(id);return e?parseFloat(e.value):NaN};
  const dp=v('cDp'),f=v('cFcr'),kg=v('cKg'),y=v('cY');
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  if(![dp,f,kg,y].every(Number.isFinite)||y<=0){['rLive','rMeat','rMonth','rYear'].forEach(i=>set(i,'—'));return}
  const fmt=(n,d)=>n.toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
  const live=f*dp, meat=live/(y/100), mon=live*kg;
  set('rLive',fmt(live,2)+' บาท');set('rMeat',fmt(meat,2)+' บาท');set('rMonth',fmt(mon,0)+' บาท');set('rYear',fmt(mon*12,0)+' บาท');
}

function calc2(){
  const v=id=>{const e=document.getElementById(id);return e?parseFloat(e.value):NaN};
  const k=v('kKill'),m=v('kMort'),a=v('kAge'),d=v('kDown'),hs=v('kHouse');
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  if(![k,m,a,d,hs].every(Number.isFinite)||hs<=0){['qCycle','qPlace','qCap','qHouse'].forEach(i=>set(i,'—'));return}
  const f=n=>Math.round(n).toLocaleString('th-TH');
  const place=k*(1+m/100), cap=place*(a+d);
  set('qCycle',f(a+d)+' วัน');set('qPlace',f(place)+' ตัว');set('qCap',f(cap)+' ตัว');set('qHouse',f(Math.ceil(cap/hs))+' หลัง');
}

const ATT={};
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function attListHTML(id){const fs=ATT[id]||[];return fs.map((f,i)=>`<li><b>${esc(f.name)}</b><span>${fmtSize(f.size)}${f.sheets&&f.sheets.length?' · '+f.sheets.map(x=>esc(x.name)+(x.cols.length?' ('+x.cols.length+' คอลัมน์)':'')).join(', '):f.note?' · '+esc(f.note):''}</span><button class="copy2" data-rmatt="${i}" aria-label="นำไฟล์ออก">นำออก</button></li>`).join('')}
function refreshAtt(id){const l=document.getElementById('attList'),o=document.getElementById('builderOut');if(l)l.innerHTML=attListHTML(id);if(o)o.innerHTML=builderHTML(AGI[id],ATT[id]||[])}
function readOne(f){return new Promise(res=>{
  const ext=(f.name.split('.').pop()||'').toLowerCase(); const out={name:f.name,size:f.size,sheets:[]};
  const r=new FileReader();
  if(ext==='csv'||ext==='txt'){r.onload=()=>{const line=String(r.result).split(/\r?\n/)[0]||'';out.sheets=[{name:f.name,cols:line.split(/[,\t;]/).map(x=>x.trim().replace(/^"|"$/g,'')).filter(Boolean)}];res(out)};r.onerror=()=>{out.note='อ่านไฟล์ไม่ได้';res(out)};r.readAsText(f);return}
  if((ext==='xlsx'||ext==='xls')&&window.XLSX){r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array',sheetRows:6});out.sheets=wb.SheetNames.slice(0,10).map(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,blankrows:false});const hdr=(rows.find(rw=>rw&&rw.filter(c=>c!==undefined&&c!=='').length>=2)||rows[0]||[]);return {name:n,cols:hdr.filter(c=>c!==undefined&&c!=='').map(String)}})}catch(e){out.note='อ่านโครงสร้างไม่ได้ ใช้ชื่อไฟล์แทน'}res(out)};r.onerror=()=>{out.note='อ่านไฟล์ไม่ได้';res(out)};r.readAsArrayBuffer(f);return}
  out.note=({pdf:'PDF',docx:'Word',doc:'Word',pptx:'PowerPoint',png:'ภาพ',jpg:'ภาพ',jpeg:'ภาพ'})[ext]||'ไฟล์';res(out);
})}
async function addFiles(id,list){const fs=[...list].slice(0,10);ATT[id]=ATT[id]||[];for(const f of fs){ATT[id].push(await readOne(f))}refreshAtt(id)}

   ['วิธีลดความเสี่ยงก่อนแนบไฟล์','ทำได้ในไม่กี่นาที',['ลบคอลัมน์ที่ไม่ใช้ในการวิเคราะห์','แทนชื่อบุคคลและลูกค้าด้วยรหัส','แนบเฉพาะช่วงเวลาที่ต้องใช้','ตรวจว่าไม่มีชีตซ่อนที่มีข้อมูลอื่นอยู่']]],
  tip:'ถามตัวเองก่อนแนบไฟล์: ถ้าไฟล์นี้ถูกส่งต่อโดยไม่ตั้งใจ จะเกิดความเสียหายหรือไม่ ถ้าใช่ ให้ลดข้อมูลก่อนแนบ'},
 'เลือกบัญชีให้เหมาะกับเคส':{lead:'ตอบคำถาม 3 ข้อด้านล่างตามลำดับ จะรู้ว่างานนั้นควรทำในบัญชีแบบใดและด้วยเครื่องมือใด',
  secs:[['คำถามที่ 1: ใช้ข้อมูลจริงขององค์กรหรือไม่','ถ้าไม่ใช้ ฝึกในบัญชี Personal ได้ ถ้าใช้ ต้องทำในบัญชีองค์กรเท่านั้น',[]],
   ['คำถามที่ 2: ต้องทำซ้ำด้วยวิธีเดิมหรือไม่','ถ้าทำครั้งเดียว ใช้ Copilot Chat กับ Prompt ก็พอ ถ้าทำซ้ำทุกวันหรือทุกสัปดาห์ ควรสร้าง Agent',[]],
   ['คำถามที่ 3: ต้องให้งานเกิดขึ้นเองหรือไม่','ถ้ามีคนสั่งทุกครั้งได้ ใช้ Agent ก็พอ ถ้าต้องเริ่มทำเองเมื่อมีอีเมลหรือไฟล์ใหม่ ต้องใช้ Power Automate และสิทธิ์ที่องค์กรเปิดให้',[]],
   ['ตัวอย่างการตัดสินใจ','จากงานในคู่มือนี้',['ฝึกเขียน Prompt วิเคราะห์ FCR ด้วยข้อมูลสมมติ → Personal + Copilot Chat','สรุปผลตรวจรับไข่ฟักทุกวันจากไฟล์จริง → บัญชีองค์กร + Agent','แจ้งเตือนเมื่ออัตราตายเกินเกณฑ์ทันทีที่บันทึก → บัญชีองค์กร + Lists + Power Automate']]],
  prompt:'ช่วยประเมินงานต่อไปนี้ด้วยคำถาม 3 ข้อ: ใช้ข้อมูลองค์กรหรือไม่ ทำซ้ำหรือไม่ ต้องอัตโนมัติหรือไม่ แล้วแนะนำบัญชีและเครื่องมือที่เหมาะสม งาน: [อธิบายงาน]'},
 'ตัวอย่าง Dashboard ผลลัพธ์':{lead:'Dashboard ที่ดีตอบคำถามของผู้อ่านได้ภายใน 30 วินาที โครงสร้างที่ใช้ได้กับงานฟาร์มเกือบทุกแบบมี 3 ชั้น คือ ตัวเลขสรุป แนวโน้ม และรายการที่ต้องลงมือ',
  secs:[['ชั้นที่ 1: ตัวเลขสรุปด้านบน','4–6 ตัวชี้วัดที่สำคัญที่สุด แต่ละตัวแสดงค่าปัจจุบัน เป้า และสีสถานะ',['อัตราตายสะสม (%)','FCR','น้ำหนักเฉลี่ย (กก.)','EPEF','ต้นทุนต่อ กก.']],
   ['ชั้นที่ 2: แนวโน้ม','กราฟเส้นรายสัปดาห์เทียบเป้าหรือมาตรฐาน และกราฟแท่งเปรียบเทียบฟาร์มหรือโรงเรือน',['ใช้สีเดียวกันกับฟาร์มเดียวกันทุกกราฟ','แสดงเส้นมาตรฐานเป็นเส้นประ']],
   ['ชั้นที่ 3: รายการที่ต้องลงมือ','ตารางเรียงตามความเร่งด่วน บอกว่าที่ไหน ผิดจากเป้าเท่าไร และใครต้องตรวจ',['จำกัดไม่เกิน 10 แถว','มีคอลัมน์สถานะการติดตาม']],
   ['หลักการที่ต้องมีทุกครั้ง','',['ทุกตัวชี้วัดมีนิยามและสูตรเขียนไว้ในชีตแยก','ระบุวันที่ของข้อมูลล่าสุดบน Dashboard','ตัวเลขรวมตรงกับข้อมูลต้นทาง']]],
  prompt:'จากข้อมูลที่แนบ ช่วยออกแบบ Dashboard ใน Excel 3 ชั้น: ชั้นบนเป็น KPI 5 ตัวพร้อมเป้าและสีสถานะ ชั้นกลางเป็นกราฟแนวโน้มรายสัปดาห์ ชั้นล่างเป็นตาราง 10 รายการที่ต้องตรวจสอบ และสร้างชีตนิยาม KPI พร้อมสูตร'},
 'Checklist ตรวจผลวิเคราะห์จาก AI':{lead:'AI คำนวณเร็ว แต่อาจอ่านคอลัมน์ผิด ตัดข้อมูลบางส่วน หรือสรุปเกินหลักฐาน ใช้ Checklist นี้ทุกครั้งก่อนนำผลไปใช้หรือส่งต่อ',
  secs:[['ตรวจข้อมูลเข้า','',['จำนวนแถวที่ AI อ่านได้ตรงกับไฟล์จริง','AI ใช้คอลัมน์ถูกต้อง โดยเฉพาะคอลัมน์ชื่อคล้ายกัน','ช่วงวันที่ครบ ไม่ถูกตัดหัวหรือท้าย']],
   ['ตรวจการคำนวณ','',['ยอดรวมตรงกับผลรวมใน Excel','สุ่มตรวจ 3–5 แถวด้วยการคำนวณเอง','หน่วยถูกต้อง เช่น กรัมกับกิโลกรัม หรือเปอร์เซ็นต์กับสัดส่วน']],
   ['ตรวจข้อสรุป','',['แยกข้อเท็จจริงจากตัวเลข กับการตีความของ AI','ไม่มีคำว่า “เพราะ” ที่ไม่มีหลักฐานรองรับ','ข้อเสนอแนะทำได้จริงในหน้างาน']]],
  tip:'ให้ AI ตรวจงานตัวเองก่อน แล้วคุณตรวจซ้ำ จะพบข้อผิดพลาดเร็วขึ้น',
  prompt:'ตรวจผลวิเคราะห์ที่คุณเพิ่งทำ: 1) จำนวนแถวและคอลัมน์ที่ใช้ 2) แสดงสูตรของทุกตัวเลข 3) สุ่ม 3 แถวแสดงการคำนวณทีละขั้น 4) บอกข้อสรุปใดที่ยังไม่มีหลักฐานเพียงพอ'},
 'สรุปโมดูล Data Analytics':SUMM(['รวมข้อมูลให้ตรวจสอบได้ก่อนวิเคราะห์ ด้วย Mapping และ Control Total','ให้ AI แสดงสูตรของทุกตัวเลข เพื่อให้ตรวจซ้ำได้','Dashboard ที่ดีมี 3 ชั้น: ตัวเลขสรุป แนวโน้ม รายการที่ต้องลงมือ','Agent เสนอ คนยืนยัน ทุกครั้ง'],['เลือกไฟล์ข้อมูล 1 ไฟล์ที่ทำซ้ำทุกสัปดาห์','ใช้ Prompt Mode ทำงานกับไฟล์นั้น 1 รอบ','ใช้ Checklist ตรวจผลก่อนส่งต่อ'],['ข้อมูลของคุณมีคอลัมน์ใดที่ชื่อไม่ตรงกันระหว่างฟาร์ม','Control Total ของงานคุณคือตัวเลขใด','KPI ใดบ้างที่ควรอยู่บน Dashboard ของทีม'],'จากไฟล์ที่แนบ ช่วยบอกว่าควรสร้าง Agent ใดจาก 4 ตัวในบทนี้ก่อน และเพราะอะไร'),
 'เส้นทางสู่ Automation':{lead:'งานบันทึกข้อมูลประจำวันพัฒนาได้เป็น 3 ระดับ เริ่มจากใช้ Copilot ช่วยด้วยมือ จนถึงให้ระบบรับข้อมูลและแจ้งเตือนเอง ไม่จำเป็นต้องข้ามไปขั้นสุดท้ายทันที',
  secs:[['ระดับ 1: Copilot ช่วยด้วยมือ','ถ่ายภาพหรือแนบแบบฟอร์ม ให้ Copilot แปลงเป็นตาราง แล้วคัดลอกไปบันทึก',['เริ่มได้ทันที','ยังต้องมีคนทำทุกวัน']],
   ['ระดับ 2: แบบฟอร์มและตารางกลาง','ใช้ Microsoft Forms ให้ผู้ปฏิบัติกรอก ข้อมูลไปรวมใน Microsoft Lists หรือ Excel กลาง',['ข้อมูลรูปแบบเดียวกันทุกวัน','ลดการคีย์ซ้ำ']],
   ['ระดับ 3: Power Automate','ตั้ง Flow ทำงานเองเมื่อมีข้อมูลใหม่',['เมื่อมีคำตอบใหม่ในแบบฟอร์ม ให้เพิ่มแถวใน Lists','ตรวจเงื่อนไข เช่น อัตราตายเกินเกณฑ์','ส่งข้อความแจ้งใน Teams ให้ผู้รับผิดชอบ','สรุปรายสัปดาห์ส่งอีเมลอัตโนมัติ']],
   ['ข้อควรระวัง','',['เกณฑ์แจ้งเตือนต้องได้รับการอนุมัติก่อนใช้','ทดสอบ Flow กับข้อมูลตัวอย่างก่อนใช้จริง','กำหนดผู้ดูแล Flow เมื่อเกิดข้อผิดพลาด']]],
  prompt:'ช่วยออกแบบ Power Automate Flow สำหรับบันทึกประจำวัน: แบบฟอร์มมีช่อง [ระบุช่อง] เก็บลง Microsoft Lists และแจ้งเตือนใน Teams เมื่อ [เงื่อนไข] อธิบายเป็นขั้นตอนที่ทำตามได้ใน Power Automate'},
 'สรุปโมดูล Document':SUMM(['AI แปลงเอกสารและภาพถ่ายเป็นตารางได้ แต่ตัวเลขสำคัญต้องตรวจกับต้นฉบับทุกครั้ง','ให้ AI ระบุช่องที่อ่านไม่ชัดหรือไม่มั่นใจ','บันทึกประจำวันพัฒนาเป็นระบบอัตโนมัติได้ทีละระดับ'],['เลือกเอกสาร 1 แบบที่คีย์ซ้ำบ่อย','กำหนดรายการฟิลด์ที่ต้องดึง','ทดลองกับเอกสาร 5 ฉบับแล้ววัดเวลาที่ประหยัดได้'],['ฟิลด์ใดในเอกสารของคุณที่ผิดไม่ได้เลย','ใครเป็นผู้ตรวจข้อมูลก่อนบันทึก','งานใดควรอยู่ที่ระดับ 1, 2 หรือ 3 ของเส้นทางสู่ Automation'],'ดูภาพเอกสารที่แนบ แล้วเสนอรายการฟิลด์ที่ควรดึงเป็นตาราง พร้อมระบุฟิลด์ที่ต้องตรวจกับต้นฉบับ 100%'),
 'ข้อควบคุมข้อมูลต้นทุน':{lead:'ตัวเลขต้นทุนถูกใช้ตัดสินใจราคาและการลงทุน ความผิดพลาดเล็กน้อยต่อกิโลกรัมกลายเป็นมูลค่าสูงเมื่อคูณด้วยปริมาณผลิต จึงต้องมีข้อควบคุมชัดเจนก่อนให้ Agent คำนวณ',
  secs:[['แหล่งราคาและวันที่มีผล','ระบุให้ Agent ใช้ราคาฉบับใด',['ใช้ราคาที่มีผล ณ วันที่ใช้วัตถุดิบ ไม่ใช่ราคาล่าสุดเสมอไป','ระบุที่มาของราคาในรายงานทุกครั้ง']],
   ['วิธีปันส่วน','ต้องเหมือนกันทุกฟาร์มทุกงวด',['เขียนเกณฑ์ปันส่วนไว้ใน Instructions ของ Agent','ถ้าเปลี่ยนเกณฑ์ ต้องระบุว่าเปลี่ยนตั้งแต่งวดใด']],
   ['การตรวจยอด','',['ต้นทุนรวมจาก Agent ต้องตรงกับรายงานต้นทุนทางบัญชี','ส่วนต่างที่เกินเกณฑ์ต้องมีคำอธิบาย']],
   ['ความลับของข้อมูล','',['ใช้ในบัญชีองค์กรเท่านั้น','ตัดข้อมูลราคาซื้อรายผู้ขายออกถ้าไม่จำเป็นต่อการวิเคราะห์']]],
  prompt:'คำนวณต้นทุนต่อ กก. จากไฟล์ที่แนบ โดยใช้ราคาตามวันที่มีผลในชีตราคา และเกณฑ์ปันส่วน [ระบุ] แสดงสูตรทุกบรรทัด และตารางเทียบยอดรวมกับรายงานต้นทุนทางบัญชี'},
 'สรุปโมดูล Inventory & Cost':SUMM(['ใช้หลัก FEFO ให้ของที่หมดอายุก่อนถูกใช้ก่อน','ต้นทุนต้องอธิบายที่มาได้ทุกตัวเลข','การสั่งซื้อและการปรับต้นทุนต้องมีคนอนุมัติ'],['ส่งออกข้อมูลคงคลังวัคซีนและยา 1 เดือน','ให้ Agent สรุปรายการใกล้หมดอายุ 30/60/90 วัน','เทียบกับการนับจริง'],['รายการใดในคลังของคุณเสี่ยงหมดอายุมากที่สุด','เกณฑ์ปันส่วนต้นทุนของคุณเขียนไว้ที่ใด','ส่วนต่างต้นทุนเท่าไรที่ต้องอธิบาย'],'จากไฟล์คงคลังที่แนบ จัดลำดับรายการตามวันหมดอายุ และเสนอรายการที่ควรใช้ก่อน พร้อมรายการที่ถึงจุดสั่งซื้อ'),
 'การอ้างอิงและความถูกต้อง':{lead:'Agent ที่ตอบคำถามด้านเทคนิคต้องเชื่อถือได้ คำตอบทุกข้อจึงต้องบอกที่มา และต้องบอกตรง ๆ เมื่อไม่พบคำตอบในแหล่งที่กำหนด',
  secs:[['แหล่งความรู้ที่ใช้ได้','บัญชีองค์กรของเราใช้เว็บไซต์เป็น Knowledge ได้ 4 แหล่ง',['เลือกเว็บไซต์ทางการ เช่น หน่วยงานรัฐ องค์กรมาตรฐาน บริษัทสายพันธุ์','SOP ภายในให้แนบในแชทเมื่อถามคำถามที่เกี่ยวข้อง']],

/* ---------- navigation ---------- */
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function go(n){
  if(mode==='present'&&!SL[n-1].core){ // jump to nearest core slide
    const c=SL.filter(s=>s.core); n=(c.find(s=>s.n>=n)||c[c.length-1]).n;
  }
  clearTimers(); cur=n; deepTab=0;
  const s=SL[n-1];
  $('#slide').innerHTML=R[s.k](s); if(s.k==='calc')calc(); if(s.k==='calc2')calc2(); if(s.k==='pbuild')pbGen();
  visited.add(n); store.set('cpa26-visited',[...visited]); store.set('cpa26-last',n);
  try{history.replaceState(null,'','#s'+n)}catch(e){}
  const sq=seq(); const idx=sq.findIndex(x=>x.n===n);
  const pv=sq[idx-1], nx=sq[idx+1];
  $('#pager').innerHTML=(pv?`<button class="pcard" data-go="${pv.n}"><span>← ก่อนหน้า</span><b>${esc(pv.t)}</b></button>`:'<span></span>')+(nx?`<button class="pcard next" data-go="${nx.n}"><span>เรียนต่อ →</span><b>${esc(nx.t)}</b></button>`:'');
  try{window.scrollTo(0,0)}catch(e){}
  updProg(); $('#donebar').innerHTML=doneBarHTML(s);
  renderTOC(); $('#deep').hidden=true;
  document.body.classList.remove('toc-open');
}
function step(d){const sq=seq();const i=sq.findIndex(x=>x.n===cur);const t=sq[i+d];if(t)go(t.n)}
function goAgent(id){const s=SL.find(x=>x.k==='agent'&&x.a===id)||SL.find(x=>x.a===id);$('#finder').hidden=true;if(s){if(mode==='present'&&!s.core)setMode('learn');go(s.n)}}
function setMode(m){
  mode=m;store.set('cpa26-mode',m);
  document.body.classList.toggle('present',m==='present');
  $('#mPresent').setAttribute('aria-pressed',m==='present');$('#mLearn').setAttribute('aria-pressed',m==='learn');
  go(cur);
}

function playFlow(){
  const a=AGI[SL[cur-1].a]; const items=[...document.querySelectorAll('#steps li')]; const chat=$('#chat');
  clearTimers(); items.forEach(li=>li.classList.remove('on'));
  chat.querySelectorAll('.bub.a').forEach(b=>b.remove());
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; const gap=reduce?0:900;
  items.forEach((li,i)=>timers.push(setTimeout(()=>{
    li.classList.add('on');
    const b=document.createElement('div');b.className='bub a new';
    b.innerHTML=`<b>ขั้นที่ ${i+1}</b> · ${esc(a.steps[i])}`+(i===items.length-1?`<br><b>ผลลัพธ์:</b> ${esc(a.outs.join(', '))}`:'');
    chat.appendChild(b);chat.scrollTop=chat.scrollHeight;
  },gap*(i+1))));
}

    const txt=el?el.textContent:t.dataset.copytext; const orig=t.textContent;
    const ok=()=>{t.textContent='คัดลอกแล้ว';toast('คัดลอกแล้ว วางใน Copilot ได้ทันที');setTimeout(()=>t.textContent=orig,1600)};
    const fb=()=>{if(el&&!el.hidden){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='เลือกข้อความแล้ว กด Ctrl+C'}else{t.textContent='คัดลอกไม่ได้ในหน้าต่างนี้'}};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(err){fb()}
    return;
  }
});
function setTheme(t){document.documentElement.setAttribute('data-theme',t);store.set('cpa26-theme',t);$('#tLight').setAttribute('aria-pressed',t==='light');$('#tDark').setAttribute('aria-pressed',t==='dark')}
$('#tLight').onclick=()=>setTheme('light'); $('#tDark').onclick=()=>setTheme('dark');
$('#finderBtn').onclick=()=>{renderFinder();$('#finder').hidden=false;$('#fClose').focus()};
$('#fClose').onclick=()=>{$('#finder').hidden=true};
$('#finder').addEventListener('click',e=>{if(e.target.id==='finder')$('#finder').hidden=true});

$('#cmdBtn').onclick=openCmd;
$('#cmdQ').addEventListener('input',e=>cmdSearch(e.target.value));
$('#cmdQ').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdSel+1,cmdRes.length-1);cmdRender()}else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(cmdSel-1,0);cmdRender()}else if(e.key==='Enter'){e.preventDefault();const x=cmdRes[cmdSel];if(x){closeCmd();go(x.s.n)}}else if(e.key==='Escape'){closeCmd()}});
$('#cmd').addEventListener('click',e=>{if(e.target.id==='cmd')closeCmd();const li=e.target.closest('li[data-go]');if(li){closeCmd();go(+li.dataset.go)}});
$('#bnToc').onclick=()=>document.body.classList.toggle('toc-open');
$('#bnFind').onclick=openCmd;
$('#bnNext').onclick=()=>step(1);
$('#tocBtn').onclick=()=>document.body.classList.toggle('toc-open');
$('#q').addEventListener('input',e=>{query=e.target.value;renderTOC()});
document.addEventListener('input',e=>{if(e.target.closest('[data-calc]'))calc();if(e.target.closest('[data-calc2]'))calc2();if(e.target.closest('[data-pb]'))pbGen()});
document.addEventListener('change',e=>{if(e.target.closest('[data-pb]'))pbGen()});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){e.preventDefault();openCmd();return}
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'){$('#finder').hidden=true;document.body.classList.remove('toc-open')}
  if(!$('#finder').hidden)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();step(1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
});

$('#depSel').innerHTML=`<option value="all">ทั้งหมด</option>`+Object.keys(DEPTS).filter(k=>k!=='gen').map(k=>`<option value="${k}">${DEPTS[k].n}</option>`).join('');
$('#depSel').addEventListener('change',e=>{dep=e.target.value;renderTOC()});
let _dark=false;try{_dark=matchMedia('(prefers-color-scheme: dark)').matches}catch(e){}
setTheme(store.get('cpa26-theme',_dark?'dark':'light'));
go(cur);
</script>
