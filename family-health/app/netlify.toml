# เผยแพร่บน Netlify: ตั้ง Base directory = family-health/app ในหน้า Site configuration
# และใส่ตัวแปร VITE_FB_* (ดู .env.example) ที่ Site configuration → Environment variables
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# service worker ต้องไม่ถูกแคช ไม่งั้นมือถือจะไม่ได้แอปเวอร์ชันใหม่
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# แอปหน้าเดียว: ทุก path ให้เปิด index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
